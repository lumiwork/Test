<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Haus am Ende des Waldes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--lime:#c8f031;--red:#ff3b4a;--gold:#ffb21e;--blue:#5ab0ff;--pink:#fe2c55}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#03050b;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:Montserrat,system-ui,sans-serif;color:#fff}
  /* 9:16-Bühne, 1em = 100 Einheiten (Bühne ist 9em breit) */
  #stage{position:relative;overflow:hidden;background:#0d1530;font-size:40px;user-select:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* HUD oben links */
  #hud{position:absolute;left:.45em;top:.85em;font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .6s}
  #hud.on{opacity:1}
  #hud .night{font-size:.24em;color:var(--red);font-weight:800;letter-spacing:.08em}
  #hud .night i{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--red);margin-right:.35em;vertical-align:.05em;animation:rec 1.2s steps(1) infinite}
  @keyframes rec{50%{opacity:.15}}
  #clock{font-size:.92em;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-shadow:0 .04em 0 rgba(0,0,0,.5)}
  #clock.tick{animation:tick .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes tick{from{transform:translateY(-.15em);opacity:.2}to{transform:none;opacity:1}}
  #loc{font-size:.2em;color:#9aa6c8;letter-spacing:.22em;font-weight:700;margin-top:.25em}

  /* Untertitel (Wort für Wort) */
  #cap{position:absolute;left:0;right:0;top:80.5%;text-align:center;padding:0 .3em;font-weight:900;font-size:.58em;line-height:1.2;text-transform:uppercase;pointer-events:none}
  #cap.xl{font-size:.7em}
  #cap .w{display:inline-block;margin:0 .1em;opacity:0;transform:scale(.4);transition:transform .22s cubic-bezier(.2,1.6,.4,1),opacity .1s;
    text-shadow:.045em .045em 0 #000,-.045em .045em 0 #000,.045em -.045em 0 #000,-.045em -.045em 0 #000,0 .1em 0 rgba(0,0,0,.55)}
  #cap .w.in{opacity:1;transform:none}
  .hl{color:var(--lime)} .red{color:var(--red)} .gold{color:var(--gold)} .blue{color:var(--blue)} .dim{color:#8f9abb}

  /* Karten / Boxen */
  #fx{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;left:var(--left,50%);top:var(--top,17%);text-align:center;width:max-content;max-width:8.6em;opacity:0;
    transform:translate(-50%,var(--ty,0)) scale(.85);transition:transform .4s cubic-bezier(.2,1.4,.4,1),opacity .25s}
  .card.in{opacity:1;transform:translate(-50%,var(--ty,0)) scale(1)}
  .card.out{opacity:0;transform:translate(-50%,var(--ty,0)) scale(.94);transition-duration:.3s}
  .ln{display:block;opacity:0;transform:translateY(.25em);transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .25s;transition-delay:var(--d,0s)}
  .card.in .ln{opacity:1;transform:none}
  span.ln{display:inline-block}
  .pill{display:inline-block;font:700 .26em Oswald,sans-serif;letter-spacing:.08em;padding:.14em .55em;border-radius:.35em;background:var(--red);color:#fff;text-transform:uppercase}
  .pill.lime{background:var(--lime);color:#111}.pill.white{background:#eef2ff;color:#111}.pill.gold{background:var(--gold);color:#111}.pill.blue{background:var(--blue);color:#06122a}
  .big{font:700 .64em/1.04 Oswald,sans-serif;text-transform:uppercase;text-shadow:0 .05em 0 rgba(0,0,0,.55);margin-top:.1em}
  .mid{font:700 .4em/1.15 Oswald,sans-serif;text-transform:uppercase}
  .title{font:700 1.02em/.98 Oswald,sans-serif;text-transform:uppercase;text-shadow:0 .05em 0 rgba(0,0,0,.6)}
  .mega{font:700 1.55em/.95 Oswald,sans-serif;text-transform:uppercase;text-shadow:0 .05em 0 rgba(0,0,0,.6)}
  .box{background:rgba(9,13,30,.93);border:.035em solid var(--c,var(--gold));border-radius:.2em;padding:.16em .32em .2em;box-shadow:0 .06em 0 rgba(0,0,0,.5)}
  .box .big{margin-top:.04em}
  .num{font:700 1.6em/1 Oswald,sans-serif;padding:.05em .3em;color:#fff}
  .sweep{position:relative;display:inline-block}
  .sweep::after{content:'';position:absolute;left:0;right:0;bottom:-.05em;height:.08em;border-radius:.05em;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s .6s}
  .card.in .sweep::after{transform:scaleX(1)}

  /* Benachrichtigung */
  .notif{position:absolute;left:50%;top:2.2%;font-size:.3em;width:28em;display:flex;align-items:center;gap:.7em;padding:.7em .8em;border-radius:1em;
    background:rgba(52,58,94,.95);transform:translate(-50%,-150%);transition:transform .5s cubic-bezier(.2,1.2,.4,1);box-shadow:0 .4em 1em rgba(0,0,0,.4)}
  .notif.in{transform:translate(-50%,0)}
  .notif .ic{width:1.9em;height:1.9em;border-radius:.5em;background:var(--red);display:grid;place-items:center;flex:none;font-size:1.1em}
  .notif b{display:block;font-size:1em} .notif span{display:block;font-size:.85em;color:#c9d0ea;font-weight:800}
  .notif em{margin-left:auto;align-self:flex-start;font-style:normal;font-size:.75em;color:#aab3d0}

  .echo{position:absolute;font:700 1em Oswald,sans-serif;padding:.06em .45em;border-radius:.3em;background:rgba(10,14,32,.85);border:.05em solid rgba(255,255,255,.6);
    opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.2,1.5,.4,1)}
  .echo.in{opacity:var(--o);transform:translate(-50%,-50%) scale(1)}

  /* Entscheidung */
  #choices{position:absolute;left:0;right:0;top:52%;display:none;flex-direction:column;align-items:center;gap:.22em}
  .opt{font:800 .34em Montserrat,sans-serif;width:23em;display:flex;align-items:center;gap:.7em;padding:.75em .9em;border-radius:.8em;cursor:pointer;
    background:rgba(9,13,30,.94);border:.13em solid var(--c);color:#fff;text-align:left;animation:pulse 1.8s ease-in-out infinite}
  .opt:nth-child(2){animation-delay:.9s}
  .opt b{width:1.9em;height:1.9em;border-radius:.5em;background:var(--c);color:#111;display:grid;place-items:center;flex:none;font-size:1.1em}
  .opt small{display:block;color:#aab3d0;font-size:.72em;margin-top:.15em}
  @keyframes pulse{50%{transform:scale(1.035)}}

  .follow{display:inline-block;font:800 .36em Montserrat,sans-serif;padding:.6em 1.7em;border-radius:2em;background:var(--pink);margin:.7em 0 .8em;animation:pulse 1.1s ease-in-out infinite;box-shadow:0 .3em 1em rgba(254,44,85,.35)}

  #start,#again{position:absolute;left:50%;transform:translateX(-50%);font:800 .34em Montserrat,sans-serif;padding:.8em 2.2em;border-radius:2em;border:0;cursor:pointer}
  #start{top:56%;background:var(--lime);color:#111;box-shadow:0 .3em 1.2em rgba(200,240,49,.3)}
  #again{top:88%;display:none;background:rgba(255,255,255,.1);color:#fff;border:.08em solid rgba(255,255,255,.35)}
  #hint{position:absolute;left:0;right:0;top:66%;text-align:center;font:700 .2em 'JetBrains Mono',monospace;color:#8f9abb;letter-spacing:.2em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"><div class="night"><i></i>NACHT 1</div><div id="clock">23:47</div><div id="loc">WALDWEG</div></div>
  <div id="fx"></div>
  <div id="cap"></div>
  <div id="choices">
    <button class="opt" id="cL" style="--c:var(--red)"><b>A</b><span>🔴 Linke Tür<small>„Ich rette Tom.“</small></span></button>
    <button class="opt" id="cR" style="--c:#e9eeff"><b>B</b><span>⚪ Rechte Tür<small>„Ich renne raus.“</small></span></button>
  </div>
  <button id="start">▶ START</button>
  <div id="hint">PART 1 · HORROR</div>
  <button id="again">↺ NOCHMAL</button>
</div>
<script>
// ---------- Bühne ----------
const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
const vgC=document.createElement('canvas');
const VW=900,VH=1600;let K=1;
function resize(){
  const w=Math.min(innerWidth,innerHeight*9/16),h=w*16/9,dpr=Math.min(devicePixelRatio||1,2);
  stage.style.width=w+'px';stage.style.height=h+'px';stage.style.fontSize=(w/9)+'px';
  cv.width=dk.width=vgC.width=Math.round(w*dpr);cv.height=dk.height=vgC.height=Math.round(h*dpr);K=cv.width/VW;
  const g=vgC.getContext('2d'),W=vgC.width,H=vgC.height,r=g.createRadialGradient(W/2,H/2,W*.35,W/2,H/2,H*.62);
  r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=r;g.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();
const base=c=>c.setTransform(K,0,0,K,0,0);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pt=(p,a,len,d)=>[p[0]+Math.sin(a)*len*d,p[1]+Math.cos(a)*len];
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ---------- Texturen (flacher Stil) ----------
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
function planks(b,seam,h){return mk(320,h,(g,w,hh)=>{g.fillStyle=b;g.fillRect(0,0,w,hh);g.fillStyle=seam;g.fillRect(0,hh-4,w,4);g.fillRect(150,0,3,hh-4);
  g.strokeStyle='rgba(255,255,255,.04)';g.lineWidth=2;for(let i=0;i<4;i++){const y=8+i*(hh-14)/4;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(110,y+3,210,y-3,320,y);g.stroke();}});}
const extC=planks('#273055','#1a213f',46),floorC=planks('#1b2140','#11162f',40);
const wallC=mk(72,72,(g)=>{g.fillStyle='#262d52';g.fillRect(0,0,72,72);g.fillStyle='#20274a';g.beginPath();g.moveTo(36,6);g.lineTo(62,36);g.lineTo(36,66);g.lineTo(10,36);g.closePath();g.fill();g.fillStyle='#303a68';g.beginPath();g.arc(36,36,5,0,7);g.fill();});
const stripeC=mk(36,36,(g)=>{g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=6;g.beginPath();for(const o of[-36,0,36]){g.moveTo(o-10,46);g.lineTo(o+46,-10);}g.stroke();});
const fogC=mk(256,128,(g,w,h)=>{const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);r.addColorStop(0,'rgba(120,140,200,.45)');r.addColorStop(1,'rgba(120,140,200,0)');g.fillStyle=r;g.scale(1,.5);g.fillRect(0,0,w,h*2);});
const noise=[0,1,2].map(()=>mk(200,200,(g,w,h)=>{const d=g.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*40;}g.putImageData(d,0,0);}));
const P={};const pat=(n,c)=>P[n]||(P[n]=ctx.createPattern(c,'repeat'));

// ---------- Strichmännchen (breit, mit Knien & Ellbogen) ----------
const TOM={color:'#a9b8e2',back:'#7d8cb8',pack:1};
function man(o){
  const s=o.s||1,d=o.dir||1,t=o.t||0,w=o.walk||0,ph=o.phase||0,c=o.color||'#f1f3fa',cb=o.back||'#aeb6d0';
  const shake=o.scared?Math.sin(t*37)*1.8:0,breathe=Math.sin(t*2.1)*1.8*(1-w);
  const hip=[shake,-104*Math.cos(.5*w*Math.abs(Math.sin(ph)))+(o.crouch||0)];
  const lean=(o.lean||0)+w*.08;
  const neck=[hip[0]+Math.sin(lean)*84*d,hip[1]-Math.cos(lean)*84+breathe];
  const sh=[hip[0]+(neck[0]-hip[0])*.88,hip[1]+(neck[1]-hip[1])*.88];
  const hd=[neck[0]+Math.sin(lean)*30*d,neck[1]-34];
  const legs=[0,1].map(i=>{const lp=ph+i*Math.PI,ta=Math.sin(lp)*.5*w+(1-w)*(i?.09:-.09)+(o.legOff||0),b=Math.max(0,Math.cos(lp))*1.05*w,k=pt(hip,ta,52,d);return[k,pt(k,ta-b,52,d)];});
  let aim=null;
  const arms=[0,1].map(i=>{const ap=ph+i*Math.PI;let ua=-Math.sin(ap)*.55*w+(1-w)*(i?.14:-.12),fa=ua+.3+.3*w;
    if(o.scared&&!(i===1&&o.aim!=null)){ua=.35+i*.1;fa=2.4;}
    if(i===1&&o.aim!=null){ua=o.aim;fa=o.aim+.06;aim=fa;}
    const e=pt(sh,ua,44,d);return[e,pt(e,fa,42,d)];});
  const limb=(col,wd,...p)=>{ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke();};
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(s,s);ctx.lineCap=ctx.lineJoin='round';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(hip[0],2,46,9,0,0,7);ctx.fill();
  limb(cb,20,hip,...legs[0]);limb(cb,18,sh,...arms[0]);
  if(o.pack){const bx=hip[0]+(neck[0]-hip[0])*.55-22*d,by=hip[1]+(neck[1]-hip[1])*.55;ctx.fillStyle='#3a4670';rr(ctx,bx-18,by-34,36,66,12);ctx.fill();ctx.fillStyle='#2c375c';rr(ctx,bx-14,by+4,28,20,6);ctx.fill();}
  limb(c,30,hip,neck);limb(c,21,hip,...legs[1]);
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(hd[0],hd[1],32,0,7);ctx.fill();
  // Augen
  const ex=o.front?[-10,10]:[4*d,17*d],ey=hd[1]-3+(o.look||0),blink=((t+(o.seed||0))%3.6)<.13&&!o.scared;
  ctx.fillStyle=ctx.strokeStyle=o.eye||'#141a33';
  for(const e of ex){if(blink){ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hd[0]+e-4,ey);ctx.lineTo(hd[0]+e+4,ey);ctx.stroke();}else{ctx.beginPath();ctx.arc(hd[0]+e,ey,o.scared?5:3.8,0,7);ctx.fill();}}
  if(o.scared){ctx.lineWidth=3;ctx.beginPath();ctx.arc(hd[0]+(o.front?0:11*d),hd[1]+13,4.5,0,7);ctx.stroke();}
  if(aim!=null){const H=arms[1][1];ctx.save();ctx.translate(H[0],H[1]);ctx.rotate(Math.atan2(Math.cos(aim),Math.sin(aim)*d));ctx.fillStyle='#39426a';rr(ctx,-4,-8,32,16,5);ctx.fill();ctx.fillStyle='#fff3c4';ctx.fillRect(26,-8,5,16);ctx.restore();}
  limb(c,19,sh,...arms[1]);
  ctx.restore();
  const head=[o.x+hd[0]*s,o.y+hd[1]*s];
  if(o.label&&!S.black)TAGS.push([head[0],head[1]-32*s-14,...o.label]);
  let tip=null,ang=null;
  if(aim!=null){const H=arms[1][1],dx=Math.sin(aim)*d,dy=Math.cos(aim);ang=Math.atan2(dy,dx);tip=[o.x+(H[0]+dx*30)*s,o.y+(H[1]+dy*30)*s];}
  return{tip,ang,head,r:30*s};
}
const DU=['DU','#c8f031','#111'],TOMTAG=['TOM','#5ab0ff','#06122a'];
function tag(x,y,txt,bg,fg){ctx.save();ctx.font='900 22px Montserrat, sans-serif';const w=ctx.measureText(txt).width+26;ctx.fillStyle=bg;rr(ctx,x-w/2,y-34,w,34,11);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-8,y-1);ctx.lineTo(x+8,y-1);ctx.lineTo(x,y+8);ctx.fill();ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y-16);ctx.restore();}

// Die Gestalt: groß, dünn, ohne Gesicht
function creature(x,y,s,t,o={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineCap=ctx.lineJoin='round';
  const C='#04060d',sw=Math.sin(t*.8)*5,hip=[sw*.3,-240],neck=[sw,-430],sh=[sw,-412];
  ctx.strokeStyle=C;
  const L=(wd,...p)=>{ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke();};
  L(18,[-30,0],[-20,-122],hip);L(18,[30,0],[20,-122],hip);L(26,hip,neck);
  const arm=(p,rest,dir)=>{const a=rest+(dir-rest)*p,e=pt(sh,a,135,1),h=pt(e,a+(p<.5?.12*Math.sign(rest):0),135,1);L(14,sh,e,h);
    const f=pt(h,a,26,1);L(6,h,f);L(6,h,pt(h,a+.35,24,1));L(6,h,pt(h,a-.35,24,1));return h;};
  const hl=arm(o.pL||0,-.12+Math.sin(t*.9)*.03,o.dirL||-.54);
  const hr=arm(o.pR||0,.12-Math.sin(t*.9)*.03,o.dirR||.54);
  if(o.pack&&(o.pR||0)<.05){ctx.fillStyle='#3a4670';rr(ctx,hr[0]-18,hr[1]-6,36,62,12);ctx.fill();}
  ctx.save();ctx.translate(neck[0],neck[1]-50);ctx.rotate(o.tilt||0);ctx.fillStyle=C;ctx.beginPath();ctx.ellipse(0,0,27,42,0,0,7);ctx.fill();ctx.restore();
  ctx.restore();
}

// ---------- Umgebung ----------
const stars=Array.from({length:70},()=>({x:rnd(0,VW),y:rnd(0,900),r:rnd(.8,2.2),p:rnd(0,6)}));
const fogs=Array.from({length:12},()=>({x:rnd(0,VW+700),dy:rnd(-60,60),s:rnd(1.6,3.2),v:rnd(8,22),a:rnd(.25,.6)}));
const dust=Array.from({length:60},()=>({x:rnd(0,VW),y:rnd(0,VH),v:rnd(4,14),p:rnd(0,6)}));
function sky(){const g=ctx.createLinearGradient(0,0,0,1150);g.addColorStop(0,'#0a1129');g.addColorStop(1,'#1c2a52');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#cfd8f5';for(const s of stars){ctx.globalAlpha=.35+.35*Math.sin(performance.now()/700+s.p);ctx.fillRect(s.x,s.y,s.r,s.r);}ctx.globalAlpha=1;}
function moon(x,y,t){const g=ctx.createRadialGradient(x,y,30,x,y,300);g.addColorStop(0,'rgba(190,205,255,.3)');g.addColorStop(1,'rgba(190,205,255,0)');ctx.fillStyle=g;ctx.fillRect(x-300,y-300,600,600);
  ctx.fillStyle='#d6def5';ctx.beginPath();ctx.arc(x,y,58,0,7);ctx.fill();ctx.fillStyle='#b9c4e6';for(const[a,b,r]of[[-18,-12,12],[16,10,8],[-4,22,6],[22,-20,5]]){ctx.beginPath();ctx.arc(x+a,y+b,r,0,7);ctx.fill();}
  ctx.fillStyle='#0f1838';for(let i=0;i<3;i++){const cx=((t*14+i*380)%1300)-250;rr(ctx,cx,y-60+i*55,260,34,17);ctx.fill();}}
function fog(t,y,amt){ctx.save();for(const f of fogs){ctx.globalAlpha=f.a*amt;ctx.drawImage(fogC,((f.x+t*f.v)%(VW+700))-350,y+f.dy-64*f.s,256*f.s*1.5,128*f.s);}ctx.restore();}
function dusty(t,a=.5){ctx.fillStyle=`rgba(255,240,210,${a})`;for(const d of dust)ctx.fillRect((d.x+Math.sin(t*.4+d.p)*20+VW)%VW,(d.y+t*d.v)%VH,2.5,2.5);}
function ground(y){ctx.fillStyle='#0c1329';ctx.fillRect(0,y,VW,VH-y);ctx.fillStyle=pat('stripe',stripeC);ctx.fillRect(0,y,VW,VH-y);ctx.fillStyle='#1d2850';ctx.fillRect(0,y,VW,4);}
function tree(x,g,h,w,col,seed,rim){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w/2,g);ctx.lineTo(x-w*.22,g-h);ctx.lineTo(x+w*.22,g-h);ctx.lineTo(x+w/2,g);ctx.fill();
  if(rim){ctx.fillStyle=rim;ctx.beginPath();ctx.moveTo(x+w*.3,g);ctx.lineTo(x+w*.13,g-h);ctx.lineTo(x+w*.22,g-h);ctx.lineTo(x+w/2,g);ctx.fill();}
  ctx.strokeStyle=col;ctx.lineCap='round';

let nI=0;const NP=[],TAGS=[];
function frame(){

const fx=document.getElementById('fx'),capEl=document.getElementById('cap'),hudEl=document.getElementById('hud'),clockEl=document.getElementById('clock'),locEl=document.getElementById('loc');
const show=e=>requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add('in')));
function card(html,o={}){const d=document.createElement('div');d.className='card';d.innerHTML=html;
  if(o.top)d.style.setProperty('--top',o.top);if(o.ty)d.style.setProperty('--ty',o.ty);if(o.left)d.style.setProperty('--left',o.left);fx.appendChild(d);show(d);return d;}
async function out(d,ms=320){if(!d)return;d.classList.remove('in');d.classList.add('out');await sleep(ms);d.remove();}

async function echo(word){const els=[];for(const[l,tp,o,f]of[[50,38,1,.62],[28,31,.7,.48],[72,27,.5,.4],[44,21,.3,.32]]){const e=document.createElement('div');e.className='echo';e.textContent=word;
  e.style.left=l+'%';e.style.top=tp+'%';e.style.fontSize=f+'em';e.style.setProperty('--o',o);fx.appendChild(e);show(e);els.push(e);await sleep(520);}
  await sleep(1200);els.forEach(e=>e.classList.remove('in'));await sleep(400);els.forEach(e=>e.remove());}
function hud(on){hudEl.classList.toggle('on',on);}
function clock(t,loc){clockEl.textContent=t;locEl.textContent=loc;clockEl.classList.remove('tick');void clockEl.offsetWidth;clockEl.classList.add('tick');}
// Untertitel: *lime*  #rot  ~gold  — erscheinen Wort für Wort in Häppchen
async function cap(text,o={}){
  const words=text.split(/\s+/).filter(Boolean).map(w=>{const m={'*':'hl','#':'red','~':'gold'}[w[0]];return{w:m?w.slice(1).replace(/\*/g,''):w,c:m||''};});
  const chunks=[[]];for(const w of words){const c=chunks[chunks.length-1];c.push(w);if(c.length>=3||/[.,?!…:]$/.test(w.w))chunks.push([]);}
  capEl.style.top=o.top||'';capEl.className=o.big?'xl':'';
  for(const ch of chunks.filter(c=>c.length)){
    capEl.innerHTML='';ch.forEach((w,i)=>{const s=document.createElement('span');s.className='w '+w.c;s.textContent=w.w;capEl.appendChild(s);setTimeout(()=>s.classList.add('in'),30+i*110);});
    await sleep(Math.max(850,(260+ch.length*330)*(o.slow||1)));
  }
  capEl.innerHTML='';
}

  go('forest');hud(true);clock('23:47','WALDWEG');await sleep(1300);
  const r1=card(`<span class="ln pill">REGEL #1</span><div class="ln big" style="--d:.12s">NIEMALS NACHTS</div><div class="ln big" style="--d:.24s">DEN <span class="hl">WALDWEG</span></div>`);
  await cap('Man hat dir gesagt, dass *niemand* nachts den alten *Waldweg* nimmt.');
  await out(r1);
  await cap('Du hast #nicht zugehört.');
  const n1=notif('📵','Kein Netz','Notrufe sind nicht verfügbar');
  await cap('Und *Tom* ist dir gefolgt.');
  await sleep(800);await outN(n1);

  // Szene 2 – Haus
  go('house');S.watch=false;clock('23:58','LICHTUNG');await sleep(1200);
  const b1=card(`<div class="ln box"><div class="big">SEIT <span class="gold">40 JAHREN</span></div><div class="mid">KOMPLETT <span class="gold">LEER</span></div></div>`);
  await cap('Das Haus steht seit ~40 ~Jahren *leer.*');
  const b2=card(`<div class="ln mid" style="font-size:.46em"><span class="sweep">UND DOCH</span> <span class="dim">BRENNT OBEN</span> <span class="gold">LICHT</span></div>`,{top:'31%'});
  S.watch=true;
  await cap('Und doch… brennt oben ein ~Licht.',{slow:1.15});
  await sleep(900);await Promise.all([out(b1),out(b2)]);

  // Szene 3 – Tür
  go('door');clock('00:03','VERANDA');await sleep(1400);
  const c1=card(`<span class="ln pill lime" style="font-size:.36em">🔓 NICHT VERSCHLOSSEN</span>`);
  await cap('Die Tür ist #nicht verschlossen.');
  await sleep(1400);await out(c1);
  const r2=card(`<span class="ln pill white">SIE HAT</span><div class="ln big" style="--d:.12s">AUF <span class="red">DICH</span></div><div class="ln big" style="--d:.24s">GEWARTET</div>`);
  await cap('Sie hat auf *dich* #gewartet.',{slow:1.2});
  await sleep(700);await out(r2);

  // Szene 4 – Flur
  go('hall');clock('00:07','FLUR');S.tomGone=false;S.flick=false;S.black=false;await sleep(3000);
  S.flick=true;await sleep(1300);S.black=true;
  for(const n of[3,2,1]){const c=card(`<div class="ln box num" style="--c:var(--red)">${n}</div>`,{top:'45%',ty:'-50%'});await sleep(850);out(c,250);await sleep(150);}
  S.black=false;S.flick=false;S.tomGone=true;
  await cap('Drei Sekunden #Dunkelheit.');
  await cap('Mehr braucht das Haus #nicht.');
  const m=card(`<div class="ln box" style="--c:var(--red)"><span class="pill">STATUS</span><div class="big">TOM: <span class="red">VERMISST</span></div></div>`);
  await cap('Du drehst dich um… aber *Tom* ist #nicht mehr da.');
  await out(m);
  await echo('TOM?');

  // Szene 5 – Treppe
  S.doorsT=1e9;S.pL=null;S.pR=null;go('stairs');clock('00:09','TREPPE');await sleep(3000);
  await cap('Es spricht #nicht. Es *zeigt* nur.');
  S.pL=now();S.doorsT=now();
  const la=card(`<span class="ln pill">TÜR A</span>`,{top:'36%',left:'13%'});
  await cap('Hinter einer Tür wartet *Tom.*');
  S.pR=now();const lb=card(`<span class="ln pill white">TÜR B</span>`,{top:'36%',left:'87%'});
  await cap('Hinter der anderen… der *Ausgang.*');
  const w=card(`<div class="ln box" style="--c:var(--gold)"><span class="pill gold">⚠ WARNUNG</span><div class="big">NUR <span class="gold">EINE</span> TÜR</div><div class="mid">ÖFFNET SICH JE WIEDER</div></div>`);
  await cap('Aber nur #eine Tür wird sich je wieder öffnen.');
  await sleep(600);await out(w);

  // Entscheidung
  frozen=now();dimT=.55;
  await cap('Und jetzt… was tust *du?*',{slow:1.25});
  const q=card(`<span class="ln pill">DEINE WAHL</span><div class="ln title" style="--d:.12s">ENTWEDER…</div><div class="ln title hl" style="--d:.26s">ODER?</div>`,{top:'19%'});
  const ch=document.getElementById('choices');ch.style.display='flex';
  if(VIDEO){
    // Video: keine Klicks – Frage stehen lassen, dann Cliffhanger-Abspann
    await sleep(4000);ch.style.display='none';out(q);out(la);out(lb);await sleep(300);dimT=.75;hud(false);
    card(`<span class="ln pill lime">AUFLÖSUNG IN PART 2</span><div class="ln big" style="--d:.15s;font-size:.8em">FOLGEN FÜR</div><div class="ln mega hl" style="--d:.3s">PART 2</div>
      <div class="ln" style="--d:.5s"><span class="follow">❤ FOLGEN</span></div>
      <div class="ln box" style="--c:var(--blue);--d:.7s"><div class="mid">WAS WÄHLST DU?<br><span class="red">A</span> ODER <span class="blue">B</span>? SCHREIB'S IN DIE KOMMENTARE 👇</div></div>`,{top:'20%'});
    await sleep(4500);window.DONE=true;return;
  }
  const pick=await new Promise(r=>{document.getElementById('cL').onclick=()=>r('L');document.getElementById('cR').onclick=()=>r('R');});
  ch.style.display='none';out(q);out(la);out(lb);

  if(pick==='L'){
    go('endL');clock('00:13','TÜR A');await sleep(900);
    await cap('Du öffnest die #rote Tür.');await cap('*Tom* lächelt dich an.');
    S.grin=now();await cap('Aber Tom hatte nie so viele #Zähne…',{slow:1.3});
  }else{
    go('endR');clock('00:13','DRAUSSEN');await sleep(900);
    await cap('Du rennst hinaus.');await cap('Draußen ist es still. #Zu still.');
    S.lightT=now();await cap('Dann geht oben ein Licht an… in #deinem *Zimmer.*',{slow:1.3});
  }
  await sleep(1200);dimT=.75;hud(false);
  card(`<span class="ln pill lime">ENDE VON PART 1</span><div class="ln big" style="--d:.15s;font-size:.8em">FOLGEN FÜR</div><div class="ln mega hl" style="--d:.3s">PART 2</div>
    <div class="ln" style="--d:.5s"><span class="follow">❤ FOLGEN</span></div>
    <div class="ln box" style="--c:var(--blue);--d:.7s"><div class="mid">WAS HÄTTEST DU GEWÄHLT?<br><span class="red">A</span> ODER <span class="blue">B</span>? SCHREIB'S IN DIE KOMMENTARE 👇</div></div>`,{top:'20%'});
  await sleep(2500);document.getElementById('again').style.display='block';
}
const VIDEO=new URLSearchParams(location.search).has('video');
if(VIDEO){document.getElementById('start').remove();document.getElementById('hint').remove();}
requestAnimationFrame(frame);go('intro');
if(!VIDEO)document.getElementById('start').onclick=e=>{e.target.remove();document.getElementById('hint').remove();story();};
document.getElementById('again').onclick=()=>location.reload();
</script>
</body>
</html>
