<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AfD-Hack für Dummies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@600;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/engine.css">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"><div class="night"><i></i></div><div id="clock"></div><div id="loc"></div></div>
  <div id="fx"></div>
  <div id="cap"></div>
  <button id="start">▶ START</button>
  <div id="hint">AFD-HACK · FÜR DUMMIES</div>
  <button id="again">↺ NOCHMAL</button>
</div>
<script src="../engine/engine.js"></script>
<script src="../engine/papier.js"></script>
<script>
// Stand: 20.10.2026. Quellen: Euronews/Bild, Handelsblatt, Tagesspiegel (dpa), t-online. Keine Inhalte aus den Mails, nur gesicherte Eckdaten.
// ---------- Bausteine ----------
function envelope(col='#fffdf5'){ctx.fillStyle=col;rr(ctx,-60,-40,120,80,8);ctx.fill();stroke(5);rr(ctx,-60,-40,120,80,8);ctx.stroke();ctx.beginPath();ctx.moveTo(-60,-38);ctx.lineTo(0,8);ctx.lineTo(60,-38);ctx.stroke();}
function serverBox(t){ctx.fillStyle='#4a4540';rr(ctx,-120,-200,240,400,16);ctx.fill();stroke(8);rr(ctx,-120,-200,240,400,16);ctx.stroke();
  for(let i=0;i<5;i++){const y=-170+i*74;ctx.fillStyle='#2b2926';rr(ctx,-96,y,192,54,8);ctx.fill();for(let k=0;k<3;k++){ctx.fillStyle=Math.sin(t*7+i*2+k)>0?GREEN:'#1a1a1a';ctx.beginPath();ctx.arc(60+k*-22,y+27,7,0,7);ctx.fill();}}}
function stamp(txt,col=RED,size=70){ctx.rotate(-.16);ctx.font=`900 ${size}px Montserrat, sans-serif`;const w=ctx.measureText(txt).width+50;stroke(10,col);rr(ctx,-w/2,-size*.75,w,size*1.5,14);ctx.stroke();bold(txt,0,4,size,col);}
function cloud(){ctx.fillStyle='#fbfaf5';for(const[x,y,r]of[[-70,10,60],[0,-20,80],[80,10,60],[0,30,60]]){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}stroke(7);ctx.beginPath();ctx.arc(-70,10,60,Math.PI*.6,Math.PI*1.45);ctx.arc(0,-20,80,Math.PI*1.15,Math.PI*1.9);ctx.arc(80,10,60,Math.PI*1.55,Math.PI*.45);ctx.stroke();}
function hacker(t){ctx.fillStyle='#2b2926';ctx.beginPath();ctx.moveTo(-90,170);ctx.quadraticCurveTo(-100,20,-60,-20);ctx.arc(0,-60,70,Math.PI*.95,Math.PI*.05);ctx.quadraticCurveTo(100,20,90,170);ctx.closePath();ctx.fill();stroke(7);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,-50,44,52,0,0,7);ctx.fill();ctx.fillStyle='#fff';const b=((t*.4)%1)>.93?.1:1;ctx.beginPath();ctx.ellipse(-16,-56,7,7*b,0,0,7);ctx.ellipse(16,-56,7,7*b,0,0,7);ctx.fill();
  ctx.fillStyle='#d9d3c4';rr(ctx,-110,80,220,120,10);ctx.fill();stroke(6);rr(ctx,-110,80,220,120,10);ctx.stroke();ctx.fillStyle=GREEN;ctx.font='800 20px JetBrains Mono, monospace';ctx.textAlign='left';ctx.fillText('> copy *',-92,120);ctx.fillText('> '+'█'.repeat(1+Math.floor(t*4)%6),-92,150);}
function building(t){ctx.fillStyle='#e9e2cf';rr(ctx,-170,-230,340,460,10);ctx.fill();stroke(8);rr(ctx,-170,-230,340,460,10);ctx.stroke();ctx.fillStyle='#fffdf5';rr(ctx,-130,-210,260,70,8);ctx.fill();stroke(5);rr(ctx,-130,-210,260,70,8);ctx.stroke();hand('Hosting-Firma',0,-174,48);
  for(let i=0;i<3;i++){ctx.save();ctx.translate(-90+i*90,40);ctx.scale(.32,.42);serverBox(t+i);ctx.restore();}}
function mailbox(name,col){ctx.fillStyle=col;rr(ctx,-90,-120,180,150,40);ctx.fill();stroke(7);rr(ctx,-90,-120,180,150,40);ctx.stroke();ctx.fillStyle='#2b2926';rr(ctx,-60,-70,120,18,9);ctx.fill();ctx.fillStyle='#8f8a80';ctx.fillRect(-12,30,24,130);ctx.strokeRect(-12,30,24,130);
  ctx.fillStyle='#fffdf5';rr(ctx,-80,-10,160,44,8);ctx.fill();stroke(4);rr(ctx,-80,-10,160,44,8);ctx.stroke();hand(name,0,12,38);}
function speech(lines,w=520){ctx.fillStyle='#fffdf5';rr(ctx,-w/2,-90,w,180,30);ctx.fill();stroke(7);rr(ctx,-w/2,-90,w,180,30);ctx.stroke();ctx.beginPath();ctx.moveTo(-w/2+60,88);ctx.lineTo(-w/2+30,150);ctx.lineTo(-w/2+120,88);ctx.fillStyle='#fffdf5';ctx.fill();ctx.stroke();lines.forEach((l,i)=>hand(l,0,-30+i*60,52));}
function newspaper(){ctx.rotate(.05);ctx.fillStyle='#f4f1e8';rr(ctx,-220,-150,440,300,6);ctx.fill();stroke(7);rr(ctx,-220,-150,440,300,6);ctx.stroke();bold('MEDIEN',0,-100,52);stroke(4);for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-190,-40+i*36);ctx.lineTo(i%2?120:190,-40+i*36);ctx.stroke();}}
function magnifier(){stroke(16);ctx.beginPath();ctx.moveTo(60,60);ctx.lineTo(150,150);ctx.stroke();ctx.fillStyle='rgba(191,227,255,.5)';ctx.beginPath();ctx.arc(0,0,90,0,7);ctx.fill();stroke(12);ctx.stroke();}
// fliegende Briefe von (x0,y0) nach oben rechts, endlos
function flyMail(t,x0,y0,n=10,spread=1){for(let i=0;i<n;i++){const p=(t*.5+i/n)%1,x=x0+p*380*spread+Math.sin(i*3)*60,y=y0-p*520+Math.cos(i*2)*40;ctx.globalAlpha=Math.min(1,(1-p)*3);at(x,y,.55+.3*((i*7)%3)/2,40+i,()=>{ctx.rotate(Math.sin(t*2+i)*.4);envelope();});}ctx.globalAlpha=1;}

const scenes={
  hook:{draw(t){paper(t);
    at(260,700,popAt(t,0,.25),1,()=>serverBox(t));flyMail(t,300,560,12);
    at(470,250,popAt(t,0,.25),2,()=>{ctx.rotate(-.04);marker(-300,-56,600,112);bold('400.000+',0,4,110,RED);});
    at(470,370,popAt(t,.1,.25),3,()=>hand('E-Mails der AfD',0,0,62));
    if(S.stamp!=null)at(560,760,popAt(t,S.stamp,.3),4,()=>stamp('GELEAKT'));}},
  server:{draw(t){paper(t);
    at(200,560,popAt(t,.05),1,()=>{ctx.scale(.55,.55);phone(()=>{ctx.fillStyle='#e8f0ff';ctx.fillRect(-138,-252,276,522);ctx.save();ctx.scale(1.2,1.2);envelope();ctx.restore();});});
    if(S.cl!=null){at(640,430,popAt(t,S.cl),2,()=>{ctx.scale(.9,.9);cloud();});at(640,700,popAt(t,S.cl+.2),3,()=>{ctx.scale(.55,.55);serverBox(t);});hand('Server',640,860,58);
      dash([280,480],[450,320],[560,480]);const p=(t*.6)%1,q=qp([280,480],[450,320],[560,480],p);at(q[0],q[1],.4,4,()=>envelope());}}},
  firma:{draw(t){paper(t);
    at(560,600,popAt(t,.05,.5),1,()=>building(t));
    if(S.hk!=null)at(200,780,popAt(t,S.hk),2,()=>{ctx.scale(.8,.8);hacker(t);});
    if(S.date!=null)at(450,200,popAt(t,S.date),3,()=>{ctx.rotate(-.04);marker(-230,-38,460,76);hand('Ende September',0,0,64);});}},
  boxes:{draw(t){paper(t);
    [['Weidel',BLUE,250],['Gauland',YEL,650]].forEach(([n,c,x],i)=>{if(S['b'+i]==null)return;at(x,620,popAt(t,S['b'+i]),i+1,()=>mailbox(n,c));flyMail(t+i*.3,x-40,480,5,.4);});
    at(450,220,popAt(t,.05),5,()=>{ctx.rotate(-.03);marker(-200,-36,400,72);hand('sollen betroffen sein',0,0,54);});}},
  claim:{draw(t){paper(t);
    at(450,330,popAt(t,.05,.5),1,()=>{speech(['nur wenige,','meist alte Postfächer']);});hand('AfD:',150,180,64,RED);
    if(S.media!=null){at(450,760,popAt(t,S.media,.5),2,()=>newspaper());at(450,800,popAt(t,S.media+.4),3,()=>{ctx.rotate(-.06);marker(-210,-40,420,80);hand('auch Mails von 2026',0,0,56);});}}},
  unknown:{draw(t){paper(t);
    at(450,640,popAt(t,.05,.5),1,()=>{ctx.scale(1.4,1.4);hacker(t);});
    if(S.q!=null)at(450,330,popAt(t,S.q),2,()=>{bold('?',0,0,260,RED);});}},
  check:{draw(t){paper(t);
    at(450,560,popAt(t,.05),1,()=>{ctx.scale(1.6,1.6);envelope();});
    const mx=450+Math.sin(t*1.5)*140;at(mx,520,popAt(t,.2),2,()=>magnifier());
    if(S.real!=null)at(450,250,popAt(t,S.real),3,()=>stamp('ECHT?',BLUE,80));
    if(S.fake!=null)at(450,850,popAt(t,S.fake,.3),4,()=>stamp('ODER FAKE?',RED,64));}},
  end:{draw(t){paper(t);
    at(450,520,popAt(t,.05,.5),1,()=>{ctx.scale(1.3,1.3);envelope();});at(450,520,popAt(t,.4),2,()=>{stroke(14,RED);ctx.beginPath();ctx.arc(0,0,190,0,7);ctx.moveTo(-134,-134);ctx.lineTo(134,134);ctx.stroke();});}},
};

// ---------- Ablauf ----------
async function story(){
  go('hook');hud(false);sfx('hit',.5);sfx('whoosh',.4);
  const tag=card(`<span class="ln pill">NEWS · FÜR DUMMIES</span>`,{top:'4%'});
  await capAt('Hacker haben offenbar über #400.000 E-Mails der *AfD* erbeutet.',5,()=>{S.stamp=now();sfx('hit',.7);});
  out(tag);go('server');sfx('pop',.6);
  await capAt('E-Mails liegen nicht in deinem Handy. Sie liegen auf einem *Server.*',7,()=>{S.cl=now();sfx('pop',.6);});
  go('firma');sfx('pop',.6);
  await capAt('Die AfD sagt: Ende September wurde ein #Dienstleister gehackt.',3,()=>{S.date=now();sfx('scribble',.4);setTimeout(()=>{S.hk=now();sfx('hit',.5);},900);});
  go('boxes');sfx('pop',.5);
  await capAt('Betroffen sein sollen auch Mails von *Weidel* und *Gauland.*',6,()=>{S.b0=now();sfx('pop',.6);setTimeout(()=>{S.b1=now();sfx('pop',.6);},700);});
  go('claim');sfx('pop',.6);
  await cap('Laut AfD nur wenige, meist alte #Postfächer.');
  await capAt('Medien berichten aber auch von Mails aus *2026.*',0,()=>{S.media=now();sfx('whoosh',.4);});
  go('unknown');sfx('hit',.4);
  await capAt('Wer dahinter steckt? #Unbekannt.',3,()=>{S.q=now();sfx('ding',.5);});
  go('check');sfx('pop',.5);
  await capAt('Sind alle Mails echt? Das wird noch *geprüft.*',2,()=>{S.real=now();sfx('hit',.5);});
  await capAt('Merke: Geleakte Daten können auch #gefälscht sein.',0,()=>{S.fake=now();sfx('hit',.6);});
  go('end');sfx('pop',.6);
  dimT=.2;await cap('Würdest du geleakte Mails lesen? Ja oder *nein?*',{big:1});
  dimT=.35;outro('NEWS FÜR DUMMIES','MEHR <span class="hl">NEWS</span>','JA ODER NEIN? 👇');
  await sleep(3800);finish();
}
boot('hook');
</script>
</body>
</html>
