<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakout · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: 'breakout', title: 'Breakout', hint: 'Drag anywhere to move the paddle. Tap to launch the ball. Clear every brick to reach the next level.', hud: { score: 'Score', lives: 'Lives', best: 'Best' } });
  var ctx = A.ctx, W = 1, H = 1, S = 1;
  var paddle = { x: 0, y: 0, w: 90, h: 12 }, ball = { x: 0, y: 0, vx: 0, vy: 0, r: 7, stuck: true };
  var bricks = [], level = 1, lives = 3, running = false, hitsSinceSpeed = 0, speed = 300, particles = [];

  A.onResize(function (w, h) { W = w; H = h; S = Math.max(0.6, Math.min(w / 360, h / 640)); paddle.w = 92 * S; paddle.h = 12 * S; paddle.y = h - 46 * S; ball.r = 7 * S; paddle.x = Math.min(Math.max(paddle.x, paddle.w / 2), w - paddle.w / 2); });

  function buildLevel() {
    bricks = [];
    var cols = 8, rows = Math.min(5 + level, 9), gapx = 4, bw = (W - 16 - (cols - 1) * gapx) / cols, bh = 18 * S, top = 54 * S;
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var hp = level >= 3 && r < 2 ? 2 : 1;
      bricks.push({ x: 8 + c * (bw + gapx), y: top + r * (bh + 4), w: bw, h: bh, hp: hp, hue: 160 + r * 24, pts: (rows - r) * 10 });
    }
  }
  function serve() { ball.stuck = true; speed = (300 + (level - 1) * 30) * S; hitsSinceSpeed = 0; }
  function launch() { if (!ball.stuck || !running) return; ball.stuck = false; var ang = Arcade.rand(-0.35, 0.35); ball.vx = Math.sin(ang) * speed; ball.vy = -Math.cos(ang) * speed; A.sfx('tap'); }
  function reset() { level = 1; lives = 3; running = true; A.setScore(0); A.setHud('lives', lives); paddle.x = W / 2; buildLevel(); serve(); }
  function nextLevel() { level++; buildLevel(); serve(); running = true; }

  function burst(x, y, hue) { for (var i = 0; i < 8; i++) particles.push({ x: x, y: y, vx: Arcade.rand(-120, 120) * S, vy: Arcade.rand(-160, 40) * S, life: 0.5, hue: hue }); }
  function update(dt) {
    for (var i = particles.length - 1; i >= 0; i--) { var q = particles[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * S * dt; if (q.life <= 0) particles.splice(i, 1); }
    if (!running) return;
    if (ball.stuck) { ball.x = paddle.x; ball.y = paddle.y - ball.r - 1; return; }
    var steps = 3, sdt = dt / steps;
    for (var s = 0; s < steps; s++) {
      var px = ball.x, py = ball.y;
      ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); A.sfx('blip'); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); A.sfx('blip'); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); A.sfx('blip'); }
      // paddle
      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h && ball.x >= paddle.x - paddle.w / 2 - ball.r && ball.x <= paddle.x + paddle.w / 2 + ball.r) {
        var rel = Arcade.clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
        var ang = rel * 1.05;
        ball.vx = Math.sin(ang) * speed; ball.vy = -Math.cos(ang) * speed;
        ball.y = paddle.y - ball.r - 0.5; A.sfx('tap');
      }
      // bricks
      for (i = 0; i < bricks.length; i++) {
        var b = bricks[i]; if (b.hp <= 0) continue;
        if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w || ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;
        if (py + ball.r <= b.y || py - ball.r >= b.y + b.h) ball.vy = -ball.vy; else ball.vx = -ball.vx;
        b.hp--; hitsSinceSpeed++;
        if (b.hp <= 0) { A.setScore(A.score + b.pts); burst(b.x + b.w / 2, b.y + b.h / 2, b.hue); A.sfx('score'); } else A.sfx('blip');
        if (hitsSinceSpeed >= 8) { hitsSinceSpeed = 0; speed *= 1.04; var m = Math.hypot(ball.vx, ball.vy); ball.vx *= speed / m; ball.vy *= speed / m; }
        break;
      }
      if (ball.y - ball.r > H) {
        lives--; A.setHud('lives', lives); A.sfx('hit'); A.buzz(60);
        if (lives <= 0) { running = false; A.gameOver({ text: 'Level ' + level + '.' }); } else serve();
        return;
      }
    }
    var left = 0; for (i = 0; i < bricks.length; i++) if (bricks[i].hp > 0) left++;
    if (!left) { running = false; A.sfx('win'); A.show({ title: 'Level ' + level + ' cleared!', big: A.score, text: 'The ball gets faster from here.', button: 'Next level', onButton: nextLevel }); }
  }
  function draw() {
    ctx.fillStyle = '#120f22'; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i]; if (b.hp <= 0) continue;
      ctx.fillStyle = 'hsl(' + b.hue + ',' + (b.hp > 1 ? 30 : 70) + '%,' + (b.hp > 1 ? 40 : 55) + '%)';
      rr(b.x, b.y, b.w, b.h, 4); ctx.fill();
    }
    for (i = 0; i < particles.length; i++) { var q = particles[i]; ctx.fillStyle = 'hsla(' + q.hue + ',80%,65%,' + Math.max(0, q.life * 2) + ')'; ctx.fillRect(q.x, q.y, 3 * S, 3 * S); }
    ctx.fillStyle = '#f2eefc'; rr(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 6 * S); ctx.fill();
    ctx.fillStyle = '#37e0c2'; rr(paddle.x - paddle.w / 2 + 4, paddle.y + 3, paddle.w - 8, paddle.h - 6, 3); ctx.fill();
    ctx.fillStyle = '#ffb648'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(163,155,196,.7)'; ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('LEVEL ' + level, 10, 10);
    if (ball.stuck && running) { ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(242,238,252,.7)'; ctx.font = '600 15px system-ui, sans-serif'; ctx.fillText('Tap to launch', W / 2, paddle.y - 48 * S); }
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function setPaddle(x) { paddle.x = Arcade.clamp(x, paddle.w / 2, W - paddle.w / 2); }

  A.input({ down: function (x) { setPaddle(x); }, move: function (x) { setPaddle(x); }, tap: function () { launch(); } });
  A.onKey(function (k) { if (k === ' ') launch(); });
  A.onStart(function () { reset(); });
  reset(); running = false;
  A.loop(function (dt) {
    if (running && !ball.stuck) { if (A.keys.ArrowLeft) setPaddle(paddle.x - 420 * S * dt); if (A.keys.ArrowRight) setPaddle(paddle.x + 420 * S * dt); }
    update(dt); draw();
  });
  A.showStart();
})();
</script>
</body>
</html>
