<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: '2048', title: '2048', hint: 'Swipe to slide every tile. Two equal tiles merge into one. Reach 2048, then keep going.' });
  var ctx = A.ctx, W = 1, H = 1, N = 4, size = 10, ox = 0, oy = 0, pad = 8, tile = 10;
  var grid = [], anims = {}, running = false, won = false, now = 0;
  var COLORS = { 2: ['#2c2750', '#f2eefc'], 4: ['#3a3366', '#f2eefc'], 8: ['#37e0c2', '#06201b'], 16: ['#2bc5aa', '#06201b'], 32: ['#ffb648', '#2a1800'], 64: ['#ff9f1c', '#2a1800'], 128: ['#ff5c7a', '#fff'], 256: ['#ff3d64', '#fff'], 512: ['#c04dff', '#fff'], 1024: ['#9d2bff', '#fff'], 2048: ['#ffd84d', '#2a1800'] };

  A.onResize(function (w, h) {
    W = w; H = h; size = Math.min(w - 24, h - 24, 460); pad = Math.round(size * 0.025);
    tile = (size - pad * (N + 1)) / N; ox = (w - size) / 2; oy = (h - size) / 2;
  });
  function empty() { var g = []; for (var i = 0; i < N * N; i++) g.push(0); return g; }
  function reset() { grid = empty(); anims = {}; won = false; running = true; A.setScore(0); spawn(); spawn(); }
  function spawn() {
    var free = []; for (var i = 0; i < grid.length; i++) if (!grid[i]) free.push(i);
    if (!free.length) return;
    var i = Arcade.pick(free); grid[i] = Math.random() < 0.9 ? 2 : 4; anims[i] = { t: now, kind: 'new' };
  }
  function line(dir, k) { // returns indexes of the k-th line in traversal order for direction
    var idx = [];
    for (var j = 0; j < N; j++) {
      if (dir === 'left') idx.push(k * N + j); else if (dir === 'right') idx.push(k * N + (N - 1 - j));
      else if (dir === 'up') idx.push(j * N + k); else idx.push((N - 1 - j) * N + k);
    }
    return idx;
  }
  function move(dir) {
    if (!running) return;
    var moved = false, gained = 0;
    for (var k = 0; k < N; k++) {
      var idx = line(dir, k), vals = [], merged = [];
      for (var j = 0; j < N; j++) { var v = grid[idx[j]]; if (v) vals.push(v); }
      var out = [];
      for (j = 0; j < vals.length; j++) {
        if (j + 1 < vals.length && vals[j] === vals[j + 1]) { out.push(vals[j] * 2); merged.push(out.length - 1); gained += vals[j] * 2; j++; }
        else out.push(vals[j]);
      }
      while (out.length < N) out.push(0);
      for (j = 0; j < N; j++) {
        if (grid[idx[j]] !== out[j]) moved = true;
        grid[idx[j]] = out[j];
      }
      for (j = 0; j < merged.length; j++) anims[idx[merged[j]]] = { t: now, kind: 'merge' };
    }
    if (!moved) return;
    A.sfx(gained ? 'score' : 'blip');
    if (gained) { A.setScore(A.score + gained); A.flashHud('score'); }
    spawn();
    if (!won && grid.indexOf(2048) >= 0) {
      won = true; running = false;
      A.updateBest(A.score); A.sfx('win');
      A.show({ title: 'You made 2048!', big: A.score, text: 'Keep going for a higher score?', button: 'Keep going', onButton: function () { running = true; } });
      return;
    }
    if (!canMove()) { running = false; setTimeout(function () { A.gameOver({ text: 'No moves left.' }); }, 300); }
  }
  function canMove() {
    for (var i = 0; i < N * N; i++) {
      if (!grid[i]) return true;
      var x = i % N, y = (i / N) | 0;
      if (x < N - 1 && grid[i] === grid[i + 1]) return true;
      if (y < N - 1 && grid[i] === grid[i + N]) return true;
    }
    return false;
  }
  function draw() {
    ctx.fillStyle = '#120f22'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1d1935'; rr(ox, oy, size, size, pad * 1.5); ctx.fill();
    for (var i = 0; i < N * N; i++) {
      var x = i % N, y = (i / N) | 0;
      var tx = ox + pad + x * (tile + pad), ty = oy + pad + y * (tile + pad);
      ctx.fillStyle = '#231e40'; rr(tx, ty, tile, tile, pad); ctx.fill();
      var v = grid[i]; if (!v) continue;
      var c = COLORS[v] || ['#ffd84d', '#2a1800'];
      var sc = 1, a = anims[i];
      if (a) { var p = (now - a.t) / 0.16; if (p >= 1) { delete anims[i]; } else sc = a.kind === 'new' ? 0.4 + 0.6 * p : 1 + 0.18 * Math.sin(p * Math.PI); }
      ctx.save(); ctx.translate(tx + tile / 2, ty + tile / 2); ctx.scale(sc, sc);
      ctx.fillStyle = c[0]; rr(-tile / 2, -tile / 2, tile, tile, pad); ctx.fill();
      ctx.fillStyle = c[1]; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var fs = v < 100 ? tile * 0.5 : v < 1000 ? tile * 0.4 : tile * 0.32;
      ctx.font = '700 ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText(String(v), 0, tile * 0.04);
      ctx.restore();
    }
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  A.input({ swipe: function (d) { move(d); } });
  A.onKey(function (k) { if (k === 'ArrowLeft') move('left'); else if (k === 'ArrowRight') move('right'); else if (k === 'ArrowUp') move('up'); else if (k === 'ArrowDown') move('down'); });
  A.onStart(function () { reset(); });
  reset(); running = false;
  A.loop(function (dt, t) { now = t; draw(); });
  A.showStart();
})();
</script>
</body>
</html>
