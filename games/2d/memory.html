<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
<style>
  .card { aspect-ratio: 3 / 4; border-radius: 12px; background: var(--line); display: grid; place-items: center; transition: transform .2s, background .2s, opacity .3s; position: relative; }
  .card::after { content: '?'; font: 700 26px var(--mono); color: var(--muted); opacity: .5; }
  .card svg { position: absolute; width: 58%; height: 58%; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s; }
  .card.up, .card.done { background: var(--panel); box-shadow: inset 0 0 0 2px var(--accent); }
  .card.up::after, .card.done::after { content: ''; }
  .card.up svg, .card.done svg { opacity: 1; transform: scale(1); }
  .card.done { box-shadow: inset 0 0 0 2px #1f6b5c; opacity: .55; }
  .card.wrong { background: #4a2140; }
  @media (prefers-reduced-motion: reduce) { .card, .card svg { transition: none; } }
</style>
</head>
<body>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: 'memory', title: 'Memory Match', hint: 'Flip two cards at a time and find all 8 pairs. Fewer moves is a better score.', hud: { score: 'Moves', time: 'Time', best: 'Best' }, lowerIsBetter: true, canvas: false });
  var SYMS = [
    ['#37e0c2', '<circle cx="50" cy="50" r="38"/>'],
    ['#ffb648', '<rect x="14" y="14" width="72" height="72" rx="10"/>'],
    ['#ff5c7a', '<path d="M50 10 L90 85 L10 85 Z"/>'],
    ['#c04dff', '<path d="M50 6 L94 50 L50 94 L6 50 Z"/>'],
    ['#ffd84d', '<path d="M50 6 L61 38 L95 38 L68 58 L78 92 L50 72 L22 92 L32 58 L5 38 L39 38 Z"/>'],
    ['#ff7a4d', '<path d="M50 90 C20 65 5 50 5 32 A20 20 0 0 1 50 22 A20 20 0 0 1 95 32 C95 50 80 65 50 90 Z"/>'],
    ['#5ce06a', '<path d="M50 5 L89 27 L89 73 L50 95 L11 73 L11 27 Z"/>'],
    ['#4d8dff', '<path d="M50 8 A42 42 0 1 0 50 92 A42 42 0 1 0 50 8 Z M50 30 A20 20 0 1 1 50 70 A20 20 0 1 1 50 30 Z" fill-rule="evenodd"/>']
  ];
  var wrap = A.boardWrap(), board = document.createElement('div'); board.className = 'board'; board.style.gridTemplateColumns = 'repeat(4, 1fr)'; wrap.appendChild(board);
  A.onResize(function (w, h) { board.style.maxWidth = Math.min(420, w - 28, (h - 28) * 0.75 - 8) + 'px'; });
  var cards = [], first = null, lock = false, moves = 0, time = 0, running = false, done = 0;
  function build() {
    board.innerHTML = ''; cards = []; first = null; lock = false; moves = 0; time = 0; done = 0; running = true;
    A.setScore(0); A.setHud('time', '0s');
    var deck = []; for (var i = 0; i < 8; i++) { deck.push(i, i); } Arcade.shuffle(deck);
    deck.forEach(function (s, idx) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'card'; b.setAttribute('aria-label', 'Card ' + (idx + 1));
      b.innerHTML = '<svg viewBox="0 0 100 100" fill="' + SYMS[s][0] + '">' + SYMS[s][1] + '</svg>';
      var card = { s: s, el: b, up: false, done: false };
      b.addEventListener('click', function () { flip(card); });
      cards.push(card); board.appendChild(b);
    });
  }
  function flip(card) {
    if (!running || lock || card.up || card.done) return;
    card.up = true; card.el.classList.add('up'); A.sfx('blip');
    if (!first) { first = card; return; }
    moves++; A.setScore(moves);
    var a = first; first = null;
    if (a.s === card.s) {
      a.done = card.done = true; a.el.classList.add('done'); card.el.classList.add('done'); a.el.classList.remove('up'); card.el.classList.remove('up');
      done++; A.sfx('score');
      if (done === 8) { running = false; A.gameOver({ win: true, title: 'All pairs found!', score: moves, text: moves + ' moves in ' + Math.round(time) + 's.' }); }
    } else {
      lock = true; a.el.classList.add('wrong'); card.el.classList.add('wrong');
      setTimeout(function () { a.up = card.up = false; a.el.classList.remove('up', 'wrong'); card.el.classList.remove('up', 'wrong'); lock = false; }, 750);
    }
  }
  A.onStart(function () { build(); });
  build(); running = false;
  A.loop(function (dt) { if (running) { time += dt; A.setHud('time', Math.floor(time) + 's'); } });
  A.showStart();
})();
</script>
</body>
</html>
