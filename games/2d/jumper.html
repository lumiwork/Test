<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Jumper · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: 'jumper', title: 'Sky Jumper', hint: 'Hold the left or right side of the screen to steer. Bounce from platform to platform and climb as high as you can.' });
  var ctx = A.ctx, W = 1, H = 1, S = 1;
  var p = { x: 0, y: 0, vx: 0, vy: 0, w: 30, h: 30, face: 1 }, plats = [], topY = 0, climbed = 0, running = false, steer = 0, clouds = [];
  A.onResize(function (w, h) { W = w; H = h; S = Math.max(0.6, Math.min(w / 360, h / 640)); p.w = p.h = 30 * S; clouds = []; for (var i = 0; i < 6; i++) clouds.push({ x: Math.random() * w, y: Math.random() * h, w: Arcade.rand(60, 120) * S }); });
  function addPlat(y) {
    var r = Math.random(), type = r < 0.68 ? 'normal' : r < 0.86 ? 'move' : r < 0.94 ? 'break' : 'spring';
    if (type === 'break' && plats.length && plats[plats.length - 1].type === 'break') type = 'normal';
    plats.push({ x: Arcade.rand(10 * S, W - 74 * S), y: y, w: 64 * S, h: 12 * S, type: type, dir: Math.random() < 0.5 ? -1 : 1, gone: false });
  }
  function reset() {
    plats = []; climbed = 0; running = true; steer = 0;
    plats.push({ x: W / 2 - 40 * S, y: H - 60 * S, w: 80 * S, h: 12 * S, type: 'normal', dir: 1, gone: false });
    topY = H - 60 * S;
    while (topY > -H) { topY -= Arcade.rand(50, 85) * S; addPlat(topY); }
    p.x = W / 2; p.y = H - 60 * S - p.h; p.vx = 0; p.vy = -620 * S; A.setScore(0);
  }
  function update(dt) {
    if (!running) return;
    var target = steer * 330 * S;
    p.vx += (target - p.vx) * Math.min(1, dt * 10);
    if (steer) p.face = steer;
    var prevBottom = p.y + p.h;
    p.vy += 1300 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < -p.w / 2) p.x += W + p.w; if (p.x > W + p.w / 2) p.x -= W + p.w;
    var bottom = p.y + p.h;
    for (var i = 0; i < plats.length; i++) {
      var pl = plats[i]; if (pl.gone) continue;
      if (pl.type === 'move') { pl.x += pl.dir * 90 * S * dt; if (pl.x < 4 || pl.x + pl.w > W - 4) pl.dir *= -1; }
      if (p.vy > 0 && prevBottom <= pl.y + 2 && bottom >= pl.y && p.x + p.w * 0.35 > pl.x && p.x - p.w * 0.35 < pl.x + pl.w) {
        if (pl.type === 'break') { pl.gone = true; A.sfx('hit'); continue; }
        p.vy = (pl.type === 'spring' ? -1000 : -620) * S; p.y = pl.y - p.h; A.sfx(pl.type === 'spring' ? 'score' : 'jump');
      }
    }
    if (p.y < H * 0.42) {
      var d = H * 0.42 - p.y; p.y += d; climbed += d; topY += d;
      for (i = 0; i < plats.length; i++) plats[i].y += d;
      for (i = 0; i < clouds.length; i++) { clouds[i].y += d * 0.3; if (clouds[i].y > H + 40) { clouds[i].y = -40; clouds[i].x = Math.random() * W; } }
      var sc = Math.floor(climbed / (8 * S)); if (sc !== A.score) A.setScore(sc);
    }
    while (topY > -40 * S) { var gap = Arcade.rand(50, 85 + Math.min(A.score, 600) * 0.06) * S; topY -= gap; addPlat(topY); }
    plats = plats.filter(function (pl) { return pl.y < H + 40 * S; });
    if (p.y > H + p.h) { running = false; A.sfx('over'); A.buzz(70); setTimeout(function () { A.gameOver(); }, 300); }
  }
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a1538'); g.addColorStop(1, '#120f22');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < clouds.length; i++) { var c = clouds[i]; ctx.fillStyle = 'rgba(255,255,255,.05)'; rr(c.x, c.y, c.w, c.w * 0.35, c.w * 0.17); ctx.fill(); }
    for (i = 0; i < plats.length; i++) {
      var pl = plats[i]; if (pl.gone) continue;
      ctx.fillStyle = pl.type === 'move' ? '#ffb648' : pl.type === 'break' ? '#ff5c7a' : '#37e0c2';
      rr(pl.x, pl.y, pl.w, pl.h, 6 * S); ctx.fill();
      if (pl.type === 'break') { ctx.strokeStyle = '#120f22'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pl.x + pl.w * 0.4, pl.y); ctx.lineTo(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5); ctx.lineTo(pl.x + pl.w * 0.55, pl.y + pl.h); ctx.stroke(); }
      if (pl.type === 'spring') { ctx.fillStyle = '#f2eefc'; ctx.fillRect(pl.x + pl.w / 2 - 8 * S, pl.y - 8 * S, 16 * S, 8 * S); }
    }
    ctx.save(); ctx.translate(p.x, p.y + p.h / 2); ctx.scale(p.face, 1);
    ctx.fillStyle = '#ffb648'; rr(-p.w / 2, -p.h / 2, p.w, p.h, 8 * S); ctx.fill();
    ctx.fillStyle = '#f2eefc'; ctx.beginPath(); ctx.arc(p.w * 0.18, -p.h * 0.15, p.w * 0.14, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#120f22'; ctx.beginPath(); ctx.arc(p.w * 0.22, -p.h * 0.15, p.w * 0.07, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#e28f14'; ctx.fillRect(-p.w * 0.35, p.h * 0.5 - 2, p.w * 0.25, 6 * S); ctx.fillRect(p.w * 0.1, p.h * 0.5 - 2, p.w * 0.25, 6 * S);
    ctx.restore();
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  A.input({ down: function (x) { steer = x < W / 2 ? -1 : 1; }, move: function (x) { steer = x < W / 2 ? -1 : 1; }, up: function () { steer = 0; } });
  A.onStart(function () { reset(); });
  reset(); running = false;
  A.loop(function (dt) { if (running) { if (A.keys.ArrowLeft) steer = -1; else if (A.keys.ArrowRight) steer = 1; else if (!A.keys.ArrowLeft && !A.keys.ArrowRight && steer && !pointerHeld) steer = 0; } update(dt); draw(); });
  var pointerHeld = false;
  A.stage.addEventListener('pointerdown', function () { pointerHeld = true; });
  window.addEventListener('pointerup', function () { pointerHeld = false; });
  window.addEventListener('pointercancel', function () { pointerHeld = false; });
  A.showStart();
})();
</script>
</body>
</html>
