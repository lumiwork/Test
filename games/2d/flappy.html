<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Box · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: 'flappy', title: 'Flappy Box', hint: 'Tap to flap. Slip through the gaps and never touch a pipe or the ground.' });
  var ctx = A.ctx, W = 1, H = 1, S = 1;
  var bird, pipes = [], running = false, dying = false, spawnT = 0, groundOff = 0, stars = [], hover = 0;

  A.onResize(function (w, h) {
    W = w; H = h; S = Math.max(0.6, Math.min(w / 360, h / 640));
    stars = [];
    for (var i = 0; i < 50; i++) stars.push({ x: Math.random() * w, y: Math.random() * h * 0.8, r: Math.random() * 1.4 + 0.4 });
  });
  function groundY() { return H - 72 * S; }
  function speed() { return (150 + Math.min(A.score, 40) * 2.2) * S; }

  function reset() {
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, r: 15 * S, rot: 0, wing: 0 };
    pipes = []; spawnT = 1.1; running = true; dying = false;
    A.setScore(0);
  }
  function flap() { if (!running) return; bird.vy = -430 * S; bird.wing = 0.18; A.sfx('jump'); }
  function spawn() {
    var gap = Math.max(132, 190 - A.score * 2.5) * S;
    var minC = 80 * S + gap / 2, maxC = groundY() - 50 * S - gap / 2;
    var c = Arcade.rand(minC, maxC);
    pipes.push({ x: W + 40 * S, w: 64 * S, top: c - gap / 2, bot: c + gap / 2, passed: false });
  }
  function hits(p) {
    var r = bird.r * 0.85;
    if (bird.x + r < p.x || bird.x - r > p.x + p.w) return false;
    return bird.y - r < p.top || bird.y + r > p.bot;
  }
  function die() {
    if (!running) return;
    running = false; dying = true; A.sfx('hit'); A.buzz(80);
    setTimeout(function () { A.gameOver(); }, 550);
  }
  function update(dt) {
    groundOff = (groundOff + speed() * dt) % (40 * S);
    bird.vy += 1500 * S * dt;
    bird.y += bird.vy * dt;
    bird.wing = Math.max(0, bird.wing - dt);
    bird.rot = Arcade.clamp(bird.vy / (600 * S), -0.5, 1.2);
    if (bird.y + bird.r >= groundY()) { bird.y = groundY() - bird.r; bird.vy = 0; die(); dying = false; }
    if (!running) return;
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(1.05, 1.45 - A.score * 0.01); }
    for (var i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i];
      p.x -= speed() * dt;
      if (!p.passed && p.x + p.w < bird.x) { p.passed = true; A.setScore(A.score + 1); A.sfx('score'); A.flashHud('score'); }
      if (p.x + p.w < -10) pipes.splice(i, 1);
      else if (hits(p)) { die(); }
    }
  }
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#120f22'); g.addColorStop(1, '#241d4a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (var i = 0; i < stars.length; i++) { ctx.beginPath(); ctx.arc(stars[i].x, stars[i].y, stars[i].r, 0, 6.283); ctx.fill(); }
    // pipes
    for (i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      ctx.fillStyle = '#37e0c2';
      ctx.fillRect(p.x, 0, p.w, p.top);
      ctx.fillRect(p.x, p.bot, p.w, groundY() - p.bot);
      ctx.fillStyle = '#1f9d87';
      ctx.fillRect(p.x + p.w - 10 * S, 0, 10 * S, p.top);
      ctx.fillRect(p.x + p.w - 10 * S, p.bot, 10 * S, groundY() - p.bot);
      ctx.fillStyle = '#6cf0d8';
      ctx.fillRect(p.x - 4 * S, p.top - 22 * S, p.w + 8 * S, 22 * S);
      ctx.fillRect(p.x - 4 * S, p.bot, p.w + 8 * S, 22 * S);
    }
    // ground
    var gy = groundY();
    ctx.fillStyle = '#1d1935'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#37e0c2'; ctx.fillRect(0, gy, W, 3 * S);
    ctx.fillStyle = '#2c2750';
    for (var x = -groundOff; x < W; x += 40 * S) { ctx.fillRect(x, gy + 10 * S, 20 * S, 6 * S); }
    // bird
    ctx.save();
    ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
    var r = bird.r;
    ctx.fillStyle = '#ffb648';
    roundRect(-r, -r, 2 * r, 2 * r, 6 * S); ctx.fill();
    ctx.fillStyle = '#e28f14';
    roundRect(-r * 0.9, bird.wing > 0 ? -r * 0.6 : -r * 0.1, r * 0.9, r * 0.5, 3 * S); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * 0.45, -r * 0.35, r * 0.3, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#120f22'; ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.35, r * 0.14, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ff5c7a'; ctx.fillRect(r * 0.75, r * 0.05, r * 0.6, r * 0.32);
    ctx.restore();
    // score
    ctx.fillStyle = 'rgba(242,238,252,.9)';
    ctx.font = '700 ' + Math.round(44 * S) + 'px ' + 'ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(String(A.score), W / 2, 18 * S);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  A.input({ down: function () { flap(); } });
  A.onKey(function (k) { if (k === ' ' || k === 'ArrowUp') flap(); });
  A.onStart(function () { reset(); });
  reset(); running = false;
  A.loop(function (dt, t) { if (running || dying) update(dt); else if (!A.visible() || true) { bird.y = H * 0.42 + Math.sin(t * 3) * 6 * S; bird.rot = 0; groundOff = (groundOff + 80 * S * dt) % (40 * S); } draw(); });
  A.showStart();
})();
</script>
</body>
</html>
