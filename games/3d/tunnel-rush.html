<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunnel Rush · Pocket Arcade</title>
<link rel="stylesheet" href="../shared/arcade.css">
</head>
<body>
<script src="../lib/three.min.js"></script>
<script src="../shared/arcade.js"></script>
<script>
(function () {
  var A = Arcade.create({ id: 'tunnel', title: 'Tunnel Rush', dim: '3d', canvas: false, hint: 'Drag left or right to slide around the tunnel wall. Steer through the gaps in the barriers. It only gets faster.' });
  var T = THREE, R = Arcade.three(A, { fov: 80, bg: 0x120f22, fog: [8, 75] }), scene = R.scene, camera = R.camera;
  var RAD = 4, world = new T.Group(); scene.add(world);
  scene.add(new T.HemisphereLight(0x8a7fc0, 0x120f22, 0.75));
  var tube = new T.Mesh(new T.CylinderGeometry(RAD, RAD, 220, 28, 1, true), new T.MeshLambertMaterial({ color: 0x2a2352, side: T.BackSide })); tube.rotation.x = Math.PI / 2; tube.position.z = -90; world.add(tube);
  var ringMat = new T.MeshBasicMaterial({ color: 0x37e0c2 }), rings = [];
  for (var i = 0; i < 24; i++) { var r = new T.Mesh(new T.TorusGeometry(RAD - 0.02, 0.05, 6, 40), ringMat); r.position.z = -i * 6; world.add(r); rings.push(r); }
  var player = new T.Mesh(new T.SphereGeometry(0.32, 20, 14), new T.MeshLambertMaterial({ color: 0xffb648, emissive: 0x7a4a00 })); scene.add(player);
  var lamp = new T.PointLight(0xffb648, 1.4, 14); player.add(lamp);
  var PA = -Math.PI / 2, PR = RAD - 0.45; player.position.set(Math.cos(PA) * PR, Math.sin(PA) * PR, -4);
  camera.position.set(0, -1.2, 0); camera.lookAt(0, -2.6, -12);
  var barMat = new T.MeshLambertMaterial({ color: 0xff5c7a }), arcMat = new T.MeshLambertMaterial({ color: 0xc04dff });
  var obstacles = [], theta = 0, dist = 0, speed = 20, running = false, nextZ = -40, shake = 0;
  function angDiff(a, b) { var d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); }
  function clearObs() { obstacles.forEach(function (o) { world.remove(o.m); }); obstacles = []; }
  function reset() { clearObs(); theta = 0; dist = 0; speed = 20; running = true; nextZ = -45; shake = 0; world.rotation.z = 0; A.setScore(0); }
  function spawn(z) {
    if (Math.random() < 0.3) {
      var phi = Math.random() * Math.PI * 2, arc = new T.Mesh(new T.TorusGeometry(RAD - 0.3, 0.45, 8, 30, Math.PI * 1.1), arcMat);
      arc.rotation.z = phi; arc.position.z = z; world.add(arc); obstacles.push({ m: arc, z: z, phi: phi + Math.PI * 0.55, half: Math.PI * 0.55, depth: 0.5 });
    } else {
      var n = Arcade.randInt(1, 3), base = Math.random() * Math.PI * 2;
      for (var i = 0; i < n; i++) {
        var p = base + i * (Math.PI * 2 / n) + Arcade.rand(-0.3, 0.3), m = new T.Mesh(new T.BoxGeometry(2.3, 0.9, 1), barMat);
        m.position.set(Math.cos(p) * (RAD - 0.45), Math.sin(p) * (RAD - 0.45), z); m.rotation.z = p + Math.PI / 2; world.add(m);
        obstacles.push({ m: m, z: z, phi: p, half: 0.36, depth: 0.5 });
      }
    }
  }
  function die() { running = false; shake = 0.5; A.sfx('hit'); A.buzz(100); setTimeout(function () { A.gameOver(); }, 600); }
  function update(dt) {
    if (!running) { if (shake > 0) { shake -= dt; camera.position.x = Arcade.rand(-0.25, 0.25) * shake; camera.position.y = -1.2 + Arcade.rand(-0.2, 0.2) * shake; } return; }
    speed = 20 + Math.min(dist / 35, 32);
    var dz = speed * dt; dist += dz; A.setScore(Math.floor(dist));
    world.rotation.z = -theta;
    for (var i = 0; i < rings.length; i++) { rings[i].position.z += dz; if (rings[i].position.z > 2) rings[i].position.z -= rings.length * 6; }
    nextZ += dz;
    if (nextZ > -40) { spawn(nextZ - Arcade.rand(55, 75)); nextZ = nextZ - Arcade.rand(14, 20) + Math.min(dist / 300, 6); }
    var pa = PA + theta; // player angle in world space
    for (i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i]; o.m.position.z += dz; o.z = o.m.position.z;
      if (o.z > 4) { world.remove(o.m); obstacles.splice(i, 1); continue; }
      if (Math.abs(o.z - player.position.z) < o.depth + 0.3 && angDiff(pa, o.phi) < o.half + 0.1) { die(); return; }
    }
    player.rotation.x -= dt * 8;
  }
  var steer = 0;
  A.input({ move: function (x, y, dx) { if (running) theta -= dx * 0.011; } });
  A.onStart(function () { reset(); });
  reset(); running = false;
  A.loop(function (dt) {
    if (running) { if (A.keys.ArrowLeft) theta += 2.6 * dt; if (A.keys.ArrowRight) theta -= 2.6 * dt; }
    update(dt); R.renderer.render(scene, camera);
  });
  A.showStart();
})();
</script>
</body>
</html>
