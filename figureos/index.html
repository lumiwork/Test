<!DOCTYPE html>
<html lang="en" style="--bg:#05070a;--accent:#fff;--border:rgba(255,255,255,.08)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Figure OS</title>
<style>
:root{--panel:rgba(18,21,28,.82);--muted:#8d95a5;--hi:rgba(255,255,255,.06);--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif;user-select:none}
#wall{position:fixed;inset:0;background:radial-gradient(1200px 700px at 20% 10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent),radial-gradient(900px 600px at 90% 90%,color-mix(in srgb,var(--accent) 9%,transparent),var(--bg));background-size:cover;background-position:center}
#fx{position:fixed;inset:0;pointer-events:none}
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
.fig-title{letter-spacing:.35em;font-weight:800;font-size:22px}.fig-line{width:0;height:2px;background:var(--accent);animation:ln 1.2s forwards}@keyframes ln{to{width:180px}}
#notch{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:900;display:flex;gap:6px;padding:5px;background:var(--panel);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(18px)}
.nt{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;background:var(--hi)}
#desk{position:fixed;inset:0 0 0 76px;padding-top:50px}
.ico{position:absolute;width:92px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:14px;touch-action:none}
.ico:hover,.ico.sel{background:var(--hi)}
.ico .ig{width:56px;height:56px;margin:0 auto 6px;border-radius:15px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;font-size:26px}
.ico .ig img{width:100%;height:100%;object-fit:cover}
.ico span{display:block;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico.drag{opacity:.8;z-index:50}
#dock{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:800;background:var(--panel);border-right:1px solid var(--border);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.di{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;cursor:pointer;position:relative;font-size:22px;background:transparent;transition:.15s}
.di:hover{background:var(--hi)}.di.run::after{content:"";position:absolute;left:-8px;top:18px;width:4px;height:12px;border-radius:4px;background:var(--accent)}
.di.act{background:var(--hi)}
.sp{flex:1}.clock{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.win{position:fixed;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(26px);box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:180px}
.win.focus{border-color:rgba(255,255,255,.22)}.win.max{border-radius:0}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--border);cursor:grab;touch-action:none}
.tb b{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:14px}.wb:hover{background:var(--hi);color:#fff}.wb.x:hover{background:var(--danger)}
.wc{flex:1;overflow:auto;position:relative;user-select:text}.wc iframe{width:100%;height:100%;border:0;background:#000}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
.rz::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted)}
.shield{position:absolute;inset:0;z-index:5;display:none}.win.busy .shield{display:block}
#ctx{position:fixed;z-index:3000;min-width:190px;background:#12151c;border:1px solid var(--border);border-radius:12px;padding:6px;display:none;box-shadow:0 14px 40px #000a}
#ctx div{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}#ctx div:hover{background:var(--hi)}#ctx .d{color:var(--danger)}
.pad{padding:18px}.h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 0 12px}
.btn{background:#fff;color:#000;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}
.btn.s{background:var(--hi);color:#fff;border:1px solid var(--border)}.btn.dg{background:var(--danger);color:#fff}.btn:disabled{opacity:.5}
input,textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:#fff;font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border-radius:14px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--border);cursor:pointer;transition:.15s}.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0a0d12}.card div{padding:8px 10px}.card b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat div{background:var(--hi);border-radius:12px;padding:12px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{font-size:16px}
.msg{margin:10px 0;padding:10px;border-radius:10px;font-size:12px;background:rgba(239,68,68,.12);color:#fca5a5;display:none;user-select:text}.msg.ok{background:rgba(5,196,107,.12);color:#6ee7b7}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:0 8px 8px 0;cursor:pointer;border:2px solid transparent}.sw.on{border-color:#fff}
.chip{display:inline-block;padding:8px 14px;border-radius:10px;margin:0 8px 8px 0;cursor:pointer;background:var(--hi);border:1px solid var(--border);font-size:13px}.chip.on{background:#fff;color:#000}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.calc button{padding:16px 0;border:0;border-radius:12px;background:var(--hi);color:#fff;font-size:16px;cursor:pointer}.calc .o{background:var(--accent);color:#000}
.disp{padding:16px;text-align:right;font-size:30px;font-weight:700;min-height:64px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--hi);margin-bottom:8px}.row .ig{width:42px;height:42px;border-radius:11px;background:var(--panel);display:grid;place-items:center;font-size:20px;overflow:hidden}.row .ig img{width:100%;height:100%;object-fit:cover}.row b{flex:1}
@media(max-width:700px){#desk{inset:0 0 64px 0}#dock{top:auto;width:100%;height:64px;flex-direction:row;border-right:0;border-top:1px solid var(--border);padding:0 8px;justify-content:center}.di.run::after{left:18px;top:auto;bottom:-4px;width:12px;height:4px}.clock{display:none}.win{border-radius:0}}
</style>
</head>
<body>
<div id="boot"><div class="fig-title">FIGURE OS</div><div class="fig-line"></div></div>
<div id="wall"></div><canvas id="fx"></canvas>
<div id="notch"><div class="nt" id="ntA">◆ Figure OS</div><div class="nt" id="ntU" onclick="openApp('account')">Guest</div></div>
<div id="desk"></div>
<div id="dock"></div>
<div id="ctx"></div>

<script>
/* ============ CONFIG ============ */
// '/api' is proxied by netlify.toml -> netlify/functions/proxy.js (no CORS problems).
const API = localStorage.getItem('fos_api') || '/api';
const PLAY_BASE = 'https://figure-cloud.figure-softwares.workers.dev';

/* ============ STATE ============ */
const $=(s,r=document)=>r.querySelector(s);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const THEMES={dark:'#ffffff',figure:'#ff4d4d',neon:'#00d2ff',forest:'#05c46b',sunset:'#f53b57',amethyst:'#a55eea',gold:'#f1c40f',hacker:'#00ff00',ocean:'#0abde3',rose:'#f368e0'};
const G=(id,name,tag,img)=>({id,name,tag,img:'https://download-oss.raccoongame.com/uploads/image/'+img});
const GAMES=[
 G('bs0046','Hollow Knight: Silksong','Indie','20260618/20260618144453541.jpg'),
 G('bs0054','Forza Horizon 6','Racing','20260618/20260618144542619.jpg'),
 G('bs0096','Black Myth: Wukong','Action','20260724/20260724162056936.jpg'),
 G('bs0095','Red Dead Redemption','Action','20260724/20260724175308547.jpg'),
 G('bs0093','Battlefield 6','Shooting','20260731/20260731161441839.jpg'),
 G('bs0092','Mafia: The Old Country','Shooting','20260717/20260717171729202.jpg'),
 G('bs0087','Detroit: Become Human','Action','20260724/20260724172914224.jpg'),
 G('bs0078','DRAGON BALL: Sparking! ZERO','Action','20260729/20260729175805537.jpg'),
 G('bs0077','Invincible VS','Action','20260724/20260724172724981.jpg'),
 G('bs0064','Oddsparks','Strategy','20260710/20260710155543902.jpg'),
 G('bs0055','Resident Evil Requiem','RPG','20260618/20260618144515330.jpg'),
 G('bs0053','God of War','Action','20260618/20260618144200465.jpg'),
 G('jy0108','Grand Theft Auto V','Challenge','20260304/20260304175808508.jpg'),
 G('dg0183','Stray','Adventure','20250613/20250613153035148.jpg'),
 G('dg0170','Elden Ring','3A','20260515/2026051516303039.jpg'),
 G('jy0354','Cyberpunk 2077','3A','20260410/20260410170557349.jpg'),
 G('dg0730','Poppy Playtime: Ch. 4','RPG','20250402/20250402141532953.jpg'),
 G('kj0630','The Last of Us Part II','RPG','20260408/20260408171835296.jpg'),
 G('kj0283',"Baldur's Gate 3",'Challenge','20260410/20260410173748437.jpg'),
 G('jy0229','Stardew Valley','Strategy','20260407/20260407173529946.jpg'),
];
const APPS={
 library:{n:'Library',i:'📚',w:760,h:520},
 account:{n:'Game Login',i:'👤',w:420,h:520},
 settings:{n:'Settings',i:'⚙️',w:520,h:520},
 store:{n:'App Store',i:'🛍️',w:480,h:520},
 notes:{n:'Notes',i:'📝',w:380,h:360},
 browser:{n:'Browser',i:'🌐',w:760,h:520},
 calc:{n:'Calculator',i:'🧮',w:300,h:430},
 gifts:{n:'Gifts',i:'🎁',w:380,h:260},
 files:{n:'Files',i:'📁',w:420,h:360},
};
let S=load('fos',null)||{theme:'dark',fx:'none',wall:'',
 icons:[{k:'library',x:0,y:0},{k:'account',x:0,y:1},{k:'notes',x:0,y:2},{k:'settings',x:0,y:3},{k:'store',x:0,y:4}]};
const persist=()=>save('fos',S);
let U=load('fos_user',null); // {email,token,name,gold,diamonds,vip}
const wins={};let zTop=100,fid=null;

/* ============ THEME / FX ============ */
function applyTheme(){document.documentElement.style.setProperty('--accent',THEMES[S.theme]||'#fff');
 $('#wall').style.backgroundImage=S.wall?`url(${S.wall})`:'';}
const cv=$('#fx'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
function mk(){return{x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.2+.6,v:Math.random()*1.2+.4,a:Math.random()*6}}
function setFx(f){S.fx=f;persist();P=f==='none'?[]:Array.from({length:f==='matrix'?60:90},mk)}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);const c=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#fff';
 cx.fillStyle=cx.strokeStyle=c;
 for(const p of P){p.a+=.02;
  if(S.fx==='snow'){p.y+=p.v;p.x+=Math.sin(p.a)*.6;cx.globalAlpha=.7;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  else if(S.fx==='rain'){p.y+=p.v*9;cx.globalAlpha=.4;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-1,p.y+12);cx.stroke()}
  else if(S.fx==='stars'){cx.globalAlpha=.4+Math.sin(p.a*3)*.4;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();p.y+=p.v*.1}
  else if(S.fx==='matrix'){p.y+=p.v*4;cx.globalAlpha=.7;cx.font='14px monospace';cx.fillText(String.fromCharCode(0x30A0+Math.random()*60),p.x,p.y)}
  if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width}}
 cx.globalAlpha=1;requestAnimationFrame(loop)})();

/* ============ DESKTOP ICONS ============ */
const CELL=100,CH=104;
function icoHTML(a){return a.img?`<img src="${a.img}" alt="">`:a.i}
function appInfo(k){if(APPS[k])return APPS[k];if(k.startsWith('game:')){const g=GAMES.find(x=>x.id===k.slice(5));return g&&{n:g.name,i:'',img:g.img}}return null}
function renderDesk(){const d=$('#desk');d.innerHTML='';
 const rows=Math.max(1,Math.floor((innerHeight-60)/CH));
 S.icons=S.icons.filter(ic=>appInfo(ic.k));
 S.icons.forEach((ic,idx)=>{const a=appInfo(ic.k),e=document.createElement('div');e.className='ico';
  e.style.left=(8+ic.x*CELL)+'px';e.style.top=(8+ic.y*CH)+'px';
  e.innerHTML=`<div class="ig">${icoHTML(a)}</div><span>${a.n}</span>`;
  let sx,sy,ox,oy,moved,t0;
  e.onpointerdown=ev=>{if(ev.button)return;e.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;ox=e.offsetLeft;oy=e.offsetTop;moved=false;t0=Date.now();$('#ctx').style.display='none'};
  e.onpointermove=ev=>{if(!e.hasPointerCapture(ev.pointerId))return;const dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(Math.abs(dx)+Math.abs(dy)>6){moved=true;e.classList.add('drag')}if(moved){e.style.left=ox+dx+'px';e.style.top=oy+dy+'px'}};
  e.onpointerup=ev=>{e.releasePointerCapture(ev.pointerId);e.classList.remove('drag');
   if(moved){let nx=Math.max(0,Math.round((e.offsetLeft-8)/CELL)),ny=Math.max(0,Math.min(rows-1,Math.round((e.offsetTop-8)/CH)));
    while(S.icons.some((o,j)=>j!==idx&&o.x===nx&&o.y===ny))ny++;ic.x=nx;ic.y=ny;persist();renderDesk()}
   else openApp(ic.k)};
  e.oncontextmenu=ev=>{ev.preventDefault();ev.stopPropagation();menu(ev,[['Open',()=>openApp(ic.k)],['Remove from desktop',()=>{S.icons.splice(idx,1);persist();renderDesk()},1]])};
  d.appendChild(e)})}
function freeCell(){const rows=Math.max(1,Math.floor((innerHeight-60)/CH));for(let x=0;;x++)for(let y=0;y<rows;y++)if(!S.icons.some(i=>i.x===x&&i.y===y))return{x,y}}
function addIcon(k){if(S.icons.some(i=>i.k===k))return;S.icons.push({k,...freeCell()});persist();renderDesk()}
function removeIcon(k){S.icons=S.icons.filter(i=>i.k!==k);persist();renderDesk()}

/* ============ CONTEXT MENU ============ */
function menu(ev,items){const m=$('#ctx');m.innerHTML='';items.forEach(([t,f,d])=>{const e=document.createElement('div');e.textContent=t;if(d)e.className='d';e.onclick=()=>{m.style.display='none';f()};m.appendChild(e)});
 m.style.display='block';m.style.left=Math.min(ev.clientX,innerWidth-210)+'px';m.style.top=Math.min(ev.clientY,innerHeight-items.length*38-12)+'px'}
addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))$('#ctx').style.display='none'});
$('#desk').oncontextmenu=e=>{e.preventDefault();menu(e,[['App Store',()=>openApp('store')],['Settings',()=>openApp('settings')],['Game Login',()=>openApp('account')],['Reset desktop',()=>{S.icons=[{k:'library',x:0,y:0},{k:'account',x:0,y:1},{k:'store',x:0,y:2}];persist();renderDesk()},1]])};

/* ============ WINDOWS ============ */
function openApp(k,opt={}){const id=opt.id||k;if(wins[id]){const w=wins[id];if(w.min)toggleMin(id);focusWin(id);return}
 const a=appInfo(k)||{n:opt.title||k,w:760,h:520};
 const W=Math.min(a.w||760,innerWidth-20),H=Math.min(a.h||520,innerHeight-60);
 const n=Object.keys(wins).length;
 const el=document.createElement('div');el.className='win';
 el.style.cssText=`width:${W}px;height:${H}px;left:${Math.max(86,(innerWidth-W)/2+n*26)}px;top:${Math.max(56,(innerHeight-H)/2+n*22)}px`;
 el.innerHTML=`<div class="tb"><span>${a.i||''}</span><b>${opt.title||a.n}</b><div class="wb" data-a="min">–</div><div class="wb" data-a="max">▢</div><div class="wb x" data-a="x">✕</div></div><div class="wc"></div><div class="shield"></div><div class="rz"></div>`;
 document.body.appendChild(el);
 const w=wins[id]={id,k,el,min:false,max:false,title:opt.title||a.n,icon:a.i||'🎮',onClose:opt.onClose};
 const body=$('.wc',el);
 if(opt.render)opt.render(body);else if(R[k])R[k](body,w);
 el.onpointerdown=()=>focusWin(id);
 el.querySelectorAll('.wb').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const x=b.dataset.a;x==='x'?closeWin(id):x==='min'?toggleMin(id):toggleMax(id)});
 const tb=$('.tb',el);tb.ondblclick=()=>toggleMax(id);
 drag(tb,el,w);resize($('.rz',el),el);
 if(innerWidth<700)toggleMax(id,true);
 focusWin(id);renderDock()}
function focusWin(id){fid=id;for(const i in wins){wins[i].el.classList.toggle('focus',i===id)}wins[id].el.style.zIndex=++zTop;renderDock()}
function closeWin(id){const w=wins[id];if(!w)return;w.onClose&&w.onClose();w.el.remove();delete wins[id];renderDock()}
function toggleMin(id){const w=wins[id];w.min=!w.min;w.el.style.display=w.min?'none':'flex';if(!w.min)focusWin(id);renderDock()}
function toggleMax(id,force){const w=wins[id];if(!w.max||force){w.prev=w.el.style.cssText;w.max=true;w.el.classList.add('max');Object.assign(w.el.style,{left:innerWidth<700?'0':'76px',top:'0',width:innerWidth<700?'100vw':'calc(100vw - 76px)',height:innerWidth<700?'calc(100vh - 64px)':'100vh'})}
 else{w.max=false;w.el.classList.remove('max');w.el.style.cssText=w.prev}}
function drag(h,el,w){let sx,sy,ox,oy,on=false;
 h.onpointerdown=e=>{if(e.target.closest('.wb')||w.max)return;on=true;h.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.classList.add('busy')};
 h.onpointermove=e=>{if(!on)return;el.style.left=Math.max(-el.offsetWidth+80,Math.min(innerWidth-80,ox+e.clientX-sx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-40,oy+e.clientY-sy))+'px'};
 h.onpointerup=e=>{on=false;el.classList.remove('busy')}}
function resize(h,el){let sx,sy,ow,oh,on=false;
 h.onpointerdown=e=>{on=true;h.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ow=el.offsetWidth;oh=el.offsetHeight;el.classList.add('busy');e.stopPropagation()};
 h.onpointermove=e=>{if(!on)return;el.style.width=Math.max(280,ow+e.clientX-sx)+'px';el.style.height=Math.max(180,oh+e.clientY-sy)+'px'};
 h.onpointerup=()=>{on=false;el.classList.remove('busy')}}

/* ============ DOCK ============ */
function renderDock(){const d=$('#dock');d.innerHTML='';
 const mk=(ic,t,fn,cls='')=>{const e=document.createElement('div');e.className='di '+cls;e.title=t;e.innerHTML=ic;e.onclick=fn;d.appendChild(e)};
 mk('◆','Show desktop',()=>{const all=Object.values(wins);const anyOpen=all.some(w=>!w.min);all.forEach(w=>{w.min=anyOpen;w.el.style.display=anyOpen?'none':'flex'});renderDock()});
 ['library','account','store','settings'].forEach(k=>mk(APPS[k].i,APPS[k].n,()=>openApp(k),wins[k]?(fid===k&&!wins[k].min?'run act':'run'):''));
 Object.values(wins).filter(w=>!['library','account','store','settings'].includes(w.id)).forEach(w=>mk(w.icon&&w.icon.length<4?w.icon:'🎮',w.title,()=>w.min?toggleMin(w.id):focusWin(w.id),'run'+(fid===w.id?' act':'')));
 const sp=document.createElement('div');sp.className='sp';d.appendChild(sp);
 const c=document.createElement('div');c.className='clock';c.id='clk';d.appendChild(c);tick()}
function tick(){const c=$('#clk');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}setInterval(tick,20000);

/* ============ API / LOGIN ============ */
async function api(path,opt={}){const h={'content-type':'application/json'};if(U&&U.token)h['x-fig-token']=U.token;
 const r=await fetch(API+path,{...opt,headers:{...h,...(opt.headers||{})},credentials:'include'});
 const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{j={raw:txt}}
 return{ok:r.ok,status:r.status,j,tok:r.headers.get('x-fig-token')}}
const pick=(o,...ks)=>{for(const k of ks){const v=k.split('.').reduce((a,b)=>a&&a[b],o);if(v!==undefined&&v!==null)return v}};
async function doLogin(email,password){const r=await api('/login',{method:'POST',body:JSON.stringify({email,password})});
 if(!r.ok||pick(r.j,'success')===false||pick(r.j,'error'))throw new Error(pick(r.j,'message','error','msg','raw')||('HTTP '+r.status));
 const j=r.j,d=j.data||j.user||j;
 U={email,token:r.tok||pick(j,'token','data.token','user_token','as_user_token'),
  name:pick(d,'nickname','name','username')||email.split('@')[0],
  gold:pick(d,'gold','coin','coins'),diamonds:pick(d,'diamond','diamonds'),vip:pick(d,'vip','vipLevel','vip_status')};
 save('fos_user',U);userUI();return U}
function logout(){U=null;localStorage.removeItem('fos_user');userUI()}
function userUI(){$('#ntU').textContent=U?U.name:'Guest'}
async function refreshCredits(){if(!U)return;
 for(const p of ['/user','/me','/credits','/user/info']){try{const r=await api(p);if(r.ok&&typeof r.j==='object'){const d=r.j.data||r.j;
  U.gold=pick(d,'gold','coin','coins')??U.gold;U.diamonds=pick(d,'diamond','diamonds')??U.diamonds;U.vip=pick(d,'vip','vipLevel')??U.vip;save('fos_user',U);return true}}catch{}}return false}
function gameURL(gid){let t=U&&U.token;const q=t?'&token='+(String(t).includes('%')?encodeURIComponent(t):encodeURIComponent(encodeURIComponent(t))):'';return PLAY_BASE+'/play?gid='+gid+q}
function launch(g){if(!U&&!confirm('You are not logged in. Launch as guest anyway?'))return;
 openApp('game:'+g.id,{id:'game:'+g.id,title:g.name,render:b=>{b.innerHTML=`<iframe allow="autoplay;fullscreen;keyboard-map;clipboard-read;clipboard-write;gamepad" allowfullscreen src="${gameURL(g.id)}"></iframe>`},onClose:()=>{}});
 const w=wins['game:'+g.id];if(w)w.icon=''}

/* ============ APP RENDERERS ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R={
library(b){b.innerHTML=`<div class="pad"><input id="q" placeholder="Search games…" style="margin-bottom:14px"><div class="grid" id="gg"></div></div>`;
 const gg=$('#gg',b),draw=q=>{gg.innerHTML='';GAMES.filter(g=>(g.name+g.tag).toLowerCase().includes(q)).forEach(g=>{const c=document.createElement('div');c.className='card';
  c.innerHTML=`<img loading="lazy" src="${g.img}"><div><b>${esc(g.name)}</b><small>${g.tag}</small></div>`;c.onclick=()=>launch(g);
  c.oncontextmenu=e=>{e.preventDefault();menu(e,[['Play',()=>launch(g)],['Add to desktop',()=>addIcon('game:'+g.id)]])};gg.appendChild(c)})};
 draw('');$('#q',b).oninput=e=>draw(e.target.value.toLowerCase());
 const hint=document.createElement('div');hint.className='h';hint.style.marginTop='14px';hint.textContent='Tip: right-click a game to pin it to your desktop';b.firstChild.appendChild(hint)},

account(b,w){const draw=()=>{
 if(U){b.innerHTML=`<div class="pad"><div class="h">Active Member</div><h2>${esc(U.name)}</h2><p style="color:var(--muted)">${esc(U.email)}</p>
  <div class="stat"><div><small>Gold</small><b>${U.gold??'–'}</b></div><div><small>Diamonds</small><b>${U.diamonds??'–'}</b></div><div><small>VIP</small><b>${U.vip??'Standard'}</b></div><div><small>Session</small><b>${U.token?'Active':'No token'}</b></div></div>
  <div class="msg" id="m"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn s" id="rf">Refresh Credits</button><button class="btn dg" id="lo">Sign Out</button></div></div>`;
  $('#rf',b).onclick=async()=>{const ok=await refreshCredits();const m=$('#m',b);m.style.display='block';m.className='msg'+(ok?' ok':'');m.textContent=ok?'Updated.':'Credits endpoint not available.';ok&&draw()};
  $('#lo',b).onclick=()=>{logout();draw()}}
 else{b.innerHTML=`<div class="pad"><div class="h">Guest Mode</div><h2>Sign in to Raccoon Game</h2><p style="color:var(--muted);font-size:12px;margin-top:6px">Log in with your account to launch games with your own progress.</p>
  <label>Email Address</label><input id="e" type="email" placeholder="name@example.com" autocomplete="email"><label>Password</label><input id="p" type="password" placeholder="Enter password" autocomplete="current-password">
  <div class="msg" id="m"></div><button class="btn" id="go" style="width:100%;margin-top:12px">Sign In</button></div>`;
  const go=async()=>{const m=$('#m',b),bt=$('#go',b);m.style.display='none';bt.disabled=true;bt.textContent='Signing in…';
   try{await doLogin($('#e',b).value.trim(),$('#p',b).value);draw()}catch(er){m.style.display='block';m.className='msg';m.textContent='Login failed: '+er.message;bt.disabled=false;bt.textContent='Sign In'}};
  $('#go',b).onclick=go;$('#p',b).onkeydown=e=>e.key==='Enter'&&go()}};draw()},

settings(b){const draw=()=>{b.innerHTML=`<div class="pad"><div class="h">Themes</div><div>${Object.entries(THEMES).map(([k,c])=>`<span class="sw ${S.theme===k?'on':''}" data-t="${k}" style="background:${c}"></span>`).join('')}</div>
 <div class="h" style="margin-top:20px">Particles</div><div>${['none','snow','rain','stars','matrix'].map(f=>`<span class="chip ${S.fx===f?'on':''}" data-f="${f}">${f}</span>`).join('')}</div>
 <div class="h" style="margin-top:20px">Wallpaper (image URL)</div><input id="wp" placeholder="https://…" value="${esc(S.wall||'')}"><div style="margin-top:8px"><button class="btn s" id="wps">Apply</button> <button class="btn s" id="wpc">Clear</button></div>
 <div class="h" style="margin-top:20px">API base</div><input id="ab" value="${esc(API)}"><div style="margin-top:8px"><button class="btn s" id="abs">Save &amp; reload</button></div></div>`;
 b.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{S.theme=e.dataset.t;persist();applyTheme();draw()});
 b.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{setFx(e.dataset.f);draw()});
 $('#wps',b).onclick=()=>{S.wall=$('#wp',b).value.trim();persist();applyTheme()};$('#wpc',b).onclick=()=>{S.wall='';persist();applyTheme();draw()};
 $('#abs',b).onclick=()=>{localStorage.setItem('fos_api',$('#ab',b).value.trim()||'/api');location.reload()}};draw()},

store(b){const draw=()=>{const onD=k=>S.icons.some(i=>i.k===k);
 const apps=Object.entries(APPS).map(([k,a])=>({k,n:a.n,i:a.i}));
 b.innerHTML=`<div class="pad"><div class="h">Apps</div>${apps.map(a=>`<div class="row"><div class="ig">${a.i}</div><b>${a.n}</b><button class="btn ${onD(a.k)?'dg':''}" data-k="${a.k}">${onD(a.k)?'Remove':'Add'}</button></div>`).join('')}
 <div class="h" style="margin-top:18px">Games</div>${GAMES.map(g=>`<div class="row"><div class="ig"><img src="${g.img}"></div><b>${esc(g.name)}</b><button class="btn ${onD('game:'+g.id)?'dg':''}" data-k="game:${g.id}">${onD('game:'+g.id)?'Remove':'Add'}</button></div>`).join('')}</div>`;
 b.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{const k=e.dataset.k;onD(k)?removeIcon(k):addIcon(k);draw()})};draw()},

notes(b){b.innerHTML=`<textarea style="height:100%;border:0;border-radius:0;resize:none;background:transparent;padding:16px" placeholder="Write something…"></textarea>`;
 const t=$('textarea',b);t.value=localStorage.getItem('fos_notes')||'';t.oninput=()=>localStorage.setItem('fos_notes',t.value)},

browser(b){b.innerHTML=`<div style="display:flex;gap:8px;padding:8px"><input id="u" placeholder="https://example.com"><button class="btn" id="g">Go</button></div><div style="height:calc(100% - 56px)"><iframe id="f"></iframe></div>`;
 const go=()=>{let u=$('#u',b).value.trim();if(!u)return;if(!/^https?:/.test(u))u='https://'+u;$('#f',b).src=u};$('#g',b).onclick=go;$('#u',b).onkeydown=e=>e.key==='Enter'&&go()},

calc(b){let e='';b.innerHTML=`<div class="disp" id="d">0</div><div class="calc"></div>`;const d=$('#d',b);
 '7 8 9 / 4 5 6 * 1 2 3 - 0 . = + C ⌫'.split(' ').forEach(k=>{const x=document.createElement('button');x.textContent=k;if('/*-+='.includes(k))x.className='o';
  x.onclick=()=>{if(k==='C')e='';else if(k==='⌫')e=e.slice(0,-1);else if(k==='='){try{e=String(Function('"use strict";return('+(e||0)+')')())}catch{e='Error'}}else{if(e==='Error')e='';e+=k}d.textContent=e||'0'};$('.calc',b).appendChild(x)})},

gifts(b){b.innerHTML=`<div class="pad"><div class="h">Gifts &amp; Rewards</div><h2>Coming soon</h2><p style="color:var(--muted);margin-top:8px">Daily rewards are on the way.</p></div>`},

files(b){b.innerHTML=`<div class="pad"><div class="h">Desktop</div>${S.icons.map(i=>{const a=appInfo(i.k);return `<div class="row"><div class="ig">${icoHTML(a)}</div><b>${esc(a.n)}</b></div>`}).join('')||'<p style="color:var(--muted)">Empty</p>'}</div>`}
};

/* ============ INIT ============ */
// Let the user pin games opened from Library; also allow game windows via R fallback
applyTheme();setFx(S.fx);userUI();renderDesk();renderDock();addEventListener('resize',renderDesk);
setTimeout(()=>{$('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),600)},1300);
</script>
