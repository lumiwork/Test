<!DOCTYPE html>
<html lang="en" style="--bg:#05070a;--accent:#ffffff;--border:rgba(255,255,255,.08)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Figure OS</title>
<style>
:root{--panel:rgba(16,19,26,.84);--muted:#8d95a5;--hi:rgba(255,255,255,.07);--danger:#ef4444;--ok:#34d399;--tbh:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font:14px/1.4 Inter,system-ui,"Segoe UI",sans-serif}
/* only chrome is unselectable; form fields and content must stay selectable/typeable */
.ico,.tb,.di,.nogrid,#taskbar,#rail .hd,.wb{-webkit-user-select:none;user-select:none}
input,textarea,select,.wc{-webkit-user-select:text;user-select:text}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#wall{position:fixed;inset:0;background:radial-gradient(900px 600px at 70% 30%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),radial-gradient(1000px 700px at 10% 100%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%),var(--bg);background-size:cover;background-position:center}
#fx{position:fixed;inset:0;pointer-events:none}
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
.fig-title{letter-spacing:.35em;font-weight:800;font-size:22px}.fig-line{width:0;height:2px;background:var(--accent);animation:ln 1.2s forwards}@keyframes ln{to{width:180px}}
#desk{position:fixed;inset:0 0 var(--tbh) 0;padding:10px;transition:right .25s}
body.rail #desk{right:344px}
.ico{position:absolute;width:92px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:14px;touch-action:none}
.ico:hover{background:var(--hi)}
.ico .ig{width:54px;height:54px;margin:0 auto 6px;border-radius:15px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;font-size:26px}
.ico .ig img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.ico span{display:block;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico.drag{opacity:.8;z-index:50}
/* taskbar */
#taskbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:900;height:52px;max-width:calc(100vw - 16px);display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(22px);box-shadow:0 10px 40px #0008}
.di{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;font-size:21px;transition:.15s;flex:none}
.di:hover{background:var(--hi);transform:translateY(-2px)}.di img{width:26px;height:26px;border-radius:7px;object-fit:cover}
.di.run::after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-4px;width:8px;height:3px;border-radius:3px;background:var(--muted)}.di.act::after{background:var(--accent);width:14px;margin-left:-7px}
.sep{width:1px;height:26px;background:var(--border);margin:0 4px;flex:none}
.tray{display:flex;align-items:center;gap:6px;padding-left:4px}
.chip2{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--hi);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.clock{font-size:12px;font-weight:600;text-align:right;line-height:1.15;padding:0 6px;color:#dfe3ec}.clock small{display:block;color:var(--muted);font-weight:500}
#taskbar .scroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
/* start menu */
#start{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(10px);z-index:950;width:min(440px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(26px);padding:16px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 20px 60px #000a}
#start.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.sg div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600}.sg div:hover{background:var(--hi)}.sg svg{font-size:24px}
/* right rail */
#rail{position:fixed;right:10px;top:10px;bottom:var(--tbh);width:326px;z-index:700;background:var(--panel);border:1px solid var(--border);border-radius:18px;backdrop-filter:blur(22px);display:flex;flex-direction:column;transform:translateX(120%);transition:transform .25s}
body.rail #rail{transform:none}
#rail .hd{padding:14px 14px 8px}#rail .hd b{font-size:15px}#rail .hd small{color:var(--muted);float:right;margin-top:3px}
#rail .tools{padding:0 14px 10px;display:grid;grid-template-columns:1fr auto;gap:8px}
#rl{flex:1;overflow:auto;padding:0 8px 8px}
.gi{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px;cursor:pointer}.gi:hover{background:var(--hi)}
.gi img{width:44px;height:44px;border-radius:11px;object-fit:cover;background:#0a0d12;flex:none}
.gi div{flex:1;min-width:0}.gi b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gi small{color:var(--muted)}
.gi .pin{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}.gi .pin:hover{background:var(--hi);color:#fff}
.rk{width:20px;text-align:center;color:var(--muted);font-size:11px;font-weight:700;flex:none}
/* windows */
.win{position:fixed;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(26px);box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:180px}
.win.focus{border-color:rgba(255,255,255,.22)}.win.max{border-radius:0}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--border);cursor:grab;touch-action:none}
.tb b{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb .ti{display:grid;place-items:center;font-size:16px}.tb .ti img{width:18px;height:18px;border-radius:5px}
.wb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:14px}.wb:hover{background:var(--hi);color:#fff}.wb.x:hover{background:var(--danger)}
.wc{flex:1;overflow:auto;position:relative}.wc iframe{width:100%;height:100%;border:0;background:#000;display:block}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}.rz::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted)}
.shield{position:absolute;inset:0;z-index:5;display:none}.win.busy .shield{display:block}
#ctx{position:fixed;z-index:3000;min-width:190px;background:#12151c;border:1px solid var(--border);border-radius:12px;padding:6px;display:none;box-shadow:0 14px 40px #000a}
#ctx div{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px}#ctx div:hover{background:var(--hi)}#ctx .d{color:var(--danger)}
/* ui bits */
.pad{padding:18px}.h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 0 12px}
.btn{background:#fff;color:#000;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.s{background:var(--hi);color:#fff;border:1px solid var(--border)}.btn.dg{background:var(--danger);color:#fff}.btn:disabled{opacity:.5}
input,textarea,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:#fff;font:inherit;outline:0}
select{width:auto}option{background:#12151c}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border-radius:14px;overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--border);cursor:pointer;transition:.15s}.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#0a0d12}.card div{padding:8px 10px}.card b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat div{background:var(--hi);border-radius:12px;padding:12px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{font-size:16px}
.sw{display:inline-block;width:34px;height:34px;border-radius:50%;margin:0 8px 8px 0;cursor:pointer;border:2px solid transparent}.sw.on{border-color:#fff}
.chip{display:inline-block;padding:8px 14px;border-radius:10px;margin:0 8px 8px 0;cursor:pointer;background:var(--hi);border:1px solid var(--border);font-size:13px}.chip.on{background:#fff;color:#000}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.calc button{padding:16px 0;border:0;border-radius:12px;background:var(--hi);color:#fff;font-size:16px;cursor:pointer}.calc .o{background:var(--accent);color:#000}
.disp{padding:16px;text-align:right;font-size:30px;font-weight:700;min-height:64px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--hi);margin-bottom:8px}.row .ig{width:42px;height:42px;border-radius:11px;background:var(--panel);display:grid;place-items:center;font-size:20px;overflow:hidden}.row .ig img{width:100%;height:100%;object-fit:cover}.row b{flex:1}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
/* error / json gui */
.err{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 22px;margin:auto}
.err .ei{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:rgba(239,68,68,.14);color:#f87171}.err.info .ei{background:var(--hi);color:#fff}
.err h3{font-size:17px}.err p{color:var(--muted);max-width:340px}.err .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.inl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;font-size:12px;background:rgba(239,68,68,.12);color:#fca5a5;margin:10px 0}.inl.ok{background:rgba(52,211,153,.12);color:#6ee7b7}
.jt{width:100%;border-collapse:collapse;font-size:12.5px}.jt td{padding:7px 10px;vertical-align:top;border-bottom:1px solid var(--border)}.jt td:first-child{color:var(--muted);width:34%;font-weight:600;white-space:nowrap}
.jt .jt{margin:-4px 0;background:rgba(0,0,0,.18);border-radius:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--hi);font-size:11.5px;font-weight:600}.tag.t{background:rgba(52,211,153,.15);color:#6ee7b7}.tag.f{background:rgba(239,68,68,.15);color:#fca5a5}.tag.n{color:var(--muted)}
.num{color:#93c5fd;font-weight:600}.spin{width:34px;height:34px;border:3px solid var(--hi);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:auto}@keyframes sp{to{transform:rotate(360deg)}}
.center{height:100%;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:var(--muted)}
@media(max-width:700px){body.rail #desk{right:0}#rail{left:10px;width:auto}.win{border-radius:0}.clock{display:none}.hide-m{display:none}}
</style>
</head>
<body>
<div id="boot"><div class="fig-title">FIGURE OS</div><div class="fig-line"></div></div>
<div id="wall"></div><canvas id="fx"></canvas>
<div id="desk"></div>
<div id="rail"></div>
<div id="start"></div>
<div id="taskbar"></div>
<div id="ctx"></div>
<script src="games.js"></script>
<script>
/* ============ CONFIG ============ */
// '/api' is proxied by netlify.toml -> netlify/functions/proxy.js (avoids CORS).
const API=localStorage.getItem('fos_api')||'/api';
const PLAY_BASE='https://figure-cloud.figure-softwares.workers.dev';

/* ============ HELPERS / ICONS ============ */
const $=(s,r=document)=>r.querySelector(s);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P_={
 library:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
 store:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
 notes:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
 globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
 calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M14 10h2M8 14h2M14 14h2M8 18h2M14 18h2"/>',
 gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
 folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
 code:'<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
 play:'<path d="M6 4l14 8-14 8z"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',min:'<path d="M5 12h14"/>',
 max:'<rect x="5" y="5" width="14" height="14" rx="2"/>',grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',diamond:'<path d="M12 2l9 8-9 12L3 10z"/>',desktop:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
const ic=(n,sz)=>`<svg viewBox="0 0 24 24"${sz?` style="font-size:${sz}px"`:''}>${P_[n]||''}</svg>`;

/* ============ STATE ============ */
const THEMES={dark:'#ffffff',figure:'#ff4d4d',neon:'#00d2ff',forest:'#05c46b',sunset:'#f53b57',amethyst:'#a55eea',gold:'#f1c40f',hacker:'#00ff00',ocean:'#0abde3',rose:'#f368e0'};
const APPS={
 library:{n:'Library',i:'library',w:820,h:560},account:{n:'Game Login',i:'user',w:420,h:520},settings:{n:'Settings',i:'settings',w:520,h:540},
 store:{n:'App Store',i:'store',w:500,h:560},inspector:{n:'API Inspector',i:'code',w:560,h:560},notes:{n:'Notes',i:'notes',w:380,h:360},
 browser:{n:'Browser',i:'globe',w:780,h:540},calc:{n:'Calculator',i:'calc',w:300,h:440},gifts:{n:'Gifts',i:'gift',w:380,h:260},files:{n:'Files',i:'folder',w:420,h:360},
};
const DEF_ICONS=()=>[{k:'library',x:0,y:0},{k:'account',x:0,y:1},{k:'store',x:0,y:2},{k:'settings',x:0,y:3},{k:'notes',x:0,y:4}];
let S=Object.assign({theme:'dark',fx:'none',wall:'',rail:innerWidth>1000,sort:'top',icons:DEF_ICONS()},load('fos',{}));
const persist=()=>save('fos',S);
let U=load('fos_user',null);
const wins={};let zTop=100,fid=null;
const gameById=id=>GAMES.find(g=>g.id===id);
function appInfo(k){if(APPS[k])return{...APPS[k],icon:ic(APPS[k].i)};if(k.startsWith('game:')){const g=gameById(k.slice(5));return g&&{n:g.name,icon:`<img src="${g.img}" alt="">`,img:1}}return null}

/* ============ THEME / FX ============ */
function applyTheme(){document.documentElement.style.setProperty('--accent',THEMES[S.theme]||'#fff');$('#wall').style.backgroundImage=S.wall?`url("${S.wall.replace(/"/g,'')}")`:''}
const cv=$('#fx'),cx=cv.getContext('2d');let PT=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const mkp=()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.2+.6,v:Math.random()*1.2+.4,a:Math.random()*6});
function setFx(f){S.fx=f;persist();PT=f==='none'?[]:Array.from({length:f==='matrix'?60:90},mkp)}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);if(PT.length){const c=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#fff';cx.fillStyle=cx.strokeStyle=c;
 for(const p of PT){p.a+=.02;
  if(S.fx==='snow'){p.y+=p.v;p.x+=Math.sin(p.a)*.6;cx.globalAlpha=.7;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  else if(S.fx==='rain'){p.y+=p.v*9;cx.globalAlpha=.4;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-1,p.y+12);cx.stroke()}
  else if(S.fx==='stars'){cx.globalAlpha=.4+Math.sin(p.a*3)*.4;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();p.y+=p.v*.1}
  else if(S.fx==='matrix'){p.y+=p.v*4;cx.globalAlpha=.7;cx.font='14px monospace';cx.fillText(String.fromCharCode(0x30A0+Math.random()*60),p.x,p.y)}
  if(p.y>cv.height+20){p.y=-10;p.x=Math.random()*cv.width}}cx.globalAlpha=1}requestAnimationFrame(loop)})();

/* ============ DESKTOP ICONS ============ */
const CELL=100,CH=104;
const rowsN=()=>Math.max(1,Math.floor((innerHeight-90)/CH));
function renderDesk(){const d=$('#desk');d.innerHTML='';const rows=rowsN();
 S.icons=S.icons.filter(ic_=>appInfo(ic_.k));
 S.icons.forEach((it,idx)=>{const a=appInfo(it.k),e=document.createElement('div');e.className='ico';
  e.style.left=(10+it.x*CELL)+'px';e.style.top=(10+it.y*CH)+'px';
  e.innerHTML=`<div class="ig">${a.icon}</div><span>${esc(a.n)}</span>`;
  let sx,sy,ox,oy,moved;
  e.onpointerdown=ev=>{if(ev.button)return;e.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;ox=e.offsetLeft;oy=e.offsetTop;moved=false;$('#ctx').style.display='none'};
  e.onpointermove=ev=>{if(!e.hasPointerCapture(ev.pointerId))return;const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6){moved=true;e.classList.add('drag')}if(moved){e.style.left=ox+dx+'px';e.style.top=oy+dy+'px'}};
  e.onpointerup=ev=>{if(e.hasPointerCapture(ev.pointerId))e.releasePointerCapture(ev.pointerId);e.classList.remove('drag');
   if(moved){let nx=Math.max(0,Math.round((e.offsetLeft-10)/CELL)),ny=Math.max(0,Math.min(rows-1,Math.round((e.offsetTop-10)/CH)));

 if(k.startsWith('game:')){const g=gameById(k.slice(5));if(g)launch(g);return}

 h.onpointerdown=e=>{if(e.target.closest('.wb')||w.max)return;on=true;h.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.classList.add('busy')};

/* ============ API / ERRORS / JSON GUI ============ */
async function api(path,opt={}){const h={'content-type':'application/json'};if(U&&U.token)h['x-fig-token']=U.token;
 let r;try{r=await fetch(API+path,{...opt,headers:{...h,...(opt.headers||{})},credentials:'include'})}catch(e){return{ok:false,status:0,j:{error:'Could not reach the API. Check your connection.'},net:true}}
 const txt=await r.text();let j,isJson=true;try{j=JSON.parse(txt)}catch{isJson=false;j={raw:txt}}
 return{ok:r.ok,status:r.status,j,isJson,tok:r.headers.get('x-fig-token')}}
const pick=(o,...ks)=>{for(const k of ks){const v=k.split('.').reduce((a,b)=>a&&a[b],o);if(v!==undefined&&v!==null)return v}};
function errInfo(r){const j=r.j||{};let msg=pick(j,'error','message','msg','data.message');if(msg&&typeof msg==='object')msg=pick(msg,'message')||'Something went wrong.';
 if(!msg&&!r.isJson){msg=r.status===404?'The API is not reachable here. Deploy the site with the Netlify function (see README).':'The server sent an unexpected response.'}
 msg=String(msg||'Something went wrong.');
 const needLogin=/log ?in|sign ?in|unauthor|token/i.test(msg)||r.status===401;
 return{title:needLogin?'Sign in required':'Something went wrong',msg:needLogin?'You need to sign in to Raccoon Game before you can do this.':msg,needLogin,detail:msg}}
function errCard(info,acts=[]){return`<div class="err"><div class="ei">${ic(info.needLogin?'lock':'alert')}</div><h3>${esc(info.title)}</h3><p>${esc(info.msg)}</p><div class="acts" id="ea">${acts.map((a,i)=>`<button class="btn ${a[2]||''}" data-a="${i}">${a[0]}</button>`).join('')}</div></div>`}
function bindActs(root,acts){root.querySelectorAll('#ea [data-a]').forEach(b=>b.onclick=acts[b.dataset.a][1])}
const pretty=k=>String(k).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
function jv(v,d=0){if(v===null||v===undefined)return'<span class="tag n">none</span>';
 if(typeof v==='boolean')return`<span class="tag ${v?'t':'f'}">${v?'Yes':'No'}</span>`;
 if(typeof v==='number')return`<span class="num">${v}</span>`;
 if(Array.isArray(v))return v.length?(v.every(x=>typeof x!=='object'||x===null)?v.map(x=>`<span class="tag">${esc(x)}</span>`).join(' '):`<table class="jt">${v.map((x,i)=>`<tr><td>#${i+1}</td><td>${jv(x,d+1)}</td></tr>`).join('')}</table>`):'<span class="tag n">empty</span>';
 if(typeof v==='object'){const e=Object.entries(v);return e.length?`<table class="jt">${e.map(([k,x])=>`<tr><td>${esc(pretty(k))}</td><td>${jv(x,d+1)}</td></tr>`).join('')}</table>`:'<span class="tag n">empty</span>'}
 return esc(v)}

/* ============ LOGIN ============ */
async function doLogin(email,password){const r=await api('/login',{method:'POST',body:JSON.stringify({email,password})});
 if(!r.ok||pick(r.j,'success')===false||pick(r.j,'error')){const e=new Error(errInfo(r).msg);e.info=errInfo(r);throw e}
 const j=r.j,d=j.data||j.user||j;
 U={email,token:r.tok||pick(j,'token','data.token','user_token','as_user_token'),name:pick(d,'nickname','name','username')||email.split('@')[0],
  gold:pick(d,'gold','coin','coins'),diamonds:pick(d,'diamond','diamonds'),vip:pick(d,'vip','vipLevel','vip_status'),raw:j};
 save('fos_user',U);renderBar();return U}
function logout(){U=null;localStorage.removeItem('fos_user');renderBar()}
async function refreshCredits(){if(!U)return false;for(const p of['/user','/me','/credits','/user/info']){const r=await api(p);if(r.ok&&r.isJson&&typeof r.j==='object'){const d=r.j.data||r.j;U.gold=pick(d,'gold','coin','coins')??U.gold;U.diamonds=pick(d,'diamond','diamonds')??U.diamonds;U.vip=pick(d,'vip','vipLevel')??U.vip;U.raw=r.j;save('fos_user',U);return true}}return false}
function loginForm(root,onDone){root.innerHTML=`<div class="pad"><div class="h">Guest Mode</div><h2>Sign in to Raccoon Game</h2><p style="color:var(--muted);font-size:12px;margin-top:6px">Use your Raccoon Game account to launch games.</p>
 <form id="lf" autocomplete="on"><label for="le">Email Address</label><input id="le" name="email" type="email" placeholder="name@example.com" autocomplete="username" required><label for="lp">Password</label><input id="lp" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
 <div id="lm"></div><button class="btn" id="lg" type="submit" style="width:100%;margin-top:12px">Sign In</button></form></div>`;
 const f=$('#lf',root);setTimeout(()=>$('#le',root).focus(),50);
 f.onsubmit=async ev=>{ev.preventDefault();const m=$('#lm',root),b=$('#lg',root);m.innerHTML='';b.disabled=true;b.textContent='Signing in...';
  try{await doLogin($('#le',root).value.trim(),$('#lp',root).value);onDone()}catch(er){m.innerHTML=`<div class="inl">${ic('alert')}<span>${esc(er.info?er.info.msg:er.message)}</span></div>`;b.disabled=false;b.textContent='Sign In'}}}

 const sq=$('#sq',b);sq.oninput=()=>{draw();const n=$('#sq',b);n.focus();n.setSelectionRange(n.value.length,n.value.length)}};draw()},

inspector(b){b.innerHTML=`<div class="pad"><div class="bar"><select id="m"><option>GET</option><option>POST</option></select><input id="p" value="/user" placeholder="/endpoint"><button class="btn" id="go">Send</button></div><textarea id="bd" rows="3" placeholder='JSON body (POST only), e.g. {"key":"value"}' style="margin-bottom:12px;font-family:monospace"></textarea><div id="out"></div></div>`;
 $('#go',b).onclick=async()=>{const out=$('#out',b);out.innerHTML='<div class="center" style="height:80px"><div class="spin"></div></div>';
  const m=$('#m',b).value,opt={method:m};if(m==='POST')opt.body=$('#bd',b).value||'{}';const r=await api($('#p',b).value.trim()||'/',opt);
  if(r.ok&&r.isJson)out.innerHTML=`<div style="margin-bottom:10px"><span class="tag t">${r.status} OK</span></div>${jv(r.j)}`;
  else{const i=errInfo(r);out.innerHTML=errCard(i)}}},

notes(b){b.innerHTML=`<textarea style="height:100%;border:0;border-radius:0;resize:none;background:transparent;padding:16px" placeholder="Write something..."></textarea>`;
 const t=$('textarea',b);t.value=localStorage.getItem('fos_notes')||'';t.oninput=()=>localStorage.setItem('fos_notes',t.value)},

browser(b){b.innerHTML=`<div style="display:flex;gap:8px;padding:10px"><input id="u" placeholder="Enter a URL" autocomplete="off"><button class="btn" id="g">Go</button></div><div style="height:calc(100% - 62px)"><iframe id="f"></iframe></div><div id="be"></div>`;
 const go=()=>{let u=$('#u',b).value.trim();if(!u)return;if(!/^https?:/i.test(u))u='https://'+u;$('#f',b).src=u};$('#g',b).onclick=go;$('#u',b).onkeydown=e=>{if(e.key==='Enter')go()}},

calc(b){let e='';b.innerHTML=`<div class="disp" id="d">0</div><div class="calc"></div>`;const d=$('#d',b);
 '7 8 9 / 4 5 6 * 1 2 3 - 0 . = + C DEL'.split(' ').forEach(k=>{const x=document.createElement('button');x.textContent=k;if('/*-+='.includes(k))x.className='o';
  x.onclick=()=>{if(k==='C')e='';else if(k==='DEL')e=e.slice(0,-1);else if(k==='='){try{e=String(Function('"use strict";return('+(e||0)+')')())}catch{e='Error'}}else{if(e==='Error')e='';e+=k}d.textContent=e||'0'};$('.calc',b).appendChild(x)})},

gifts(b){b.innerHTML=`<div class="err info"><div class="ei">${ic('gift')}</div><h3>Coming soon</h3><p>Daily rewards are on the way.</p></div>`},

files(b){b.innerHTML=`<div class="pad"><div class="h">Desktop</div>${S.icons.map(i=>{const a=appInfo(i.k);return`<div class="row"><div class="ig">${a.icon}</div><b>${esc(a.n)}</b></div>`}).join('')||'<p style="color:var(--muted)">Empty</p>'}</div>`}
};

document.body.classList.toggle('rail',S.rail&&innerWidth>700);
applyTheme();setFx(S.fx);renderDesk();renderRail();renderBar();
addEventListener('resize',()=>{renderDesk()});
setTimeout(()=>{$('#boot').style.opacity=0;setTimeout(()=>$('#boot').remove(),600)},1200);
