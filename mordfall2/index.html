let lastT=0;
const flash=t=>S.flashT!=null&&t>=S.flashT?Math.max(0,1-(t-S.flashT)/.45)*(Math.sin((t-S.flashT)*60)>-.3?1:.35):0;
function lightning(t){const f=flash(t);if(f>0){ctx.fillStyle=`rgba(210,225,255,${.45*f})`;ctx.fillRect(0,0,VW,VH);}}
function siren(t,x,y,r,a=1){const p=Math.sin(t*7)>0;for(const[c,on]of[['255,50,70',p],['60,120,255',!p]]){if(!on)continue;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${.35*a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}}
function tape(y,ang,t){ctx.save();ctx.translate(450,y);ctx.rotate(ang);ctx.fillStyle='#f5c518';ctx.fillRect(-700,-34,1400,68);ctx.fillStyle='#111';ctx.font='700 34px Oswald, sans-serif';ctx.textBaseline='middle';
  const txt='POLIZEI · ABSPERRUNG · ',w=ctx.measureText(txt).width,off=(t*40)%w;for(let x=-700-off;x<700;x+=w)ctx.fillText(txt,x,2);ctx.restore();}
function chalk(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='rgba(236,240,255,.85)';ctx.lineWidth=6;ctx.lineCap=ctx.lineJoin='round';ctx.setLineDash([16,9]);
  ctx.beginPath();ctx.arc(-170,-10,38,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-130,-6);ctx.lineTo(40,4);ctx.moveTo(40,4);ctx.lineTo(130,-50);ctx.lineTo(190,-30);ctx.moveTo(40,4);ctx.lineTo(120,60);ctx.lineTo(180,90);
  ctx.moveTo(-90,-6);ctx.lineTo(-40,-80);ctx.lineTo(10,-110);ctx.moveTo(-90,-2);ctx.lineTo(-30,60);ctx.lineTo(-60,110);ctx.stroke();ctx.restore();}
function marker(x,y,n,p){if(p<=0)return;const s=ease(p)*(1+.25*Math.sin(Math.min(1,p)*Math.PI));ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#f5c518';ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-18,-50);ctx.lineTo(18,-50);ctx.lineTo(26,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.font='700 32px Oswald, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,0,-24);ctx.restore();}
function villa(t,lit){
  ctx.fillStyle='#0b1022';ctx.fillRect(110,620,680,510);ctx.fillStyle=pat('ext',extC);ctx.globalAlpha=.55;ctx.fillRect(110,620,680,510);ctx.globalAlpha=1;
  ctx.fillStyle='#070b18';ctx.beginPath();ctx.moveTo(80,630);ctx.lineTo(450,430);ctx.lineTo(820,630);ctx.closePath();ctx.fill();ctx.fillRect(610,450,60,120);
  for(let r=0;r<2;r++)for(let c=0;c<5;c++){const x=150+c*130,y=680+r*210,on=(r===0&&c===3)||(r===1&&(c===1||c===2));
    ctx.fillStyle=on?'#ffcf7a':'#0c1226';rr(ctx,x,y,70,110,6);ctx.fill();if(on){const g=ctx.createRadialGradient(x+35,y+55,5,x+35,y+55,150);g.addColorStop(0,'rgba(255,200,110,.3)');g.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=g;ctx.fillRect(x-115,y-95,300,300);}

  if(lit){ctx.strokeStyle='#ff3b4a';ctx.lineWidth=5;rr(ctx,535,675,80,120,8);ctx.stroke();}
  ctx.fillStyle='#05070f';rr(ctx,410,950,80,180,6);ctx.fill();
}
function car(x,y,t){ctx.save();ctx.translate(x,y);ctx.fillStyle='#e9edf7';rr(ctx,-170,-80,340,70,22);ctx.fill();rr(ctx,-100,-130,200,60,20);ctx.fill();
  ctx.fillStyle='#2a6bd8';ctx.fillRect(-170,-55,340,16);ctx.fillStyle='#0d1428';rr(ctx,-85,-120,80,42,8);ctx.fill();rr(ctx,5,-120,80,42,8);ctx.fill();
  ctx.fillStyle='#0a0d18';for(const wx of[-100,100]){ctx.beginPath();ctx.arc(wx,-8,30,0,7);ctx.fill();}
  const p=Math.sin(t*7)>0;ctx.fillStyle=p?'#ff3b4a':'#4a1218';rr(ctx,-50,-148,48,18,6);ctx.fill();ctx.fillStyle=!p?'#3c7bff':'#121e48';rr(ctx,2,-148,48,18,6);ctx.fill();ctx.restore();siren(t,x,y-140,360,.9);}
function grandClock(x,y,t){ctx.save();ctx.translate(x,y);ctx.fillStyle='#3d2f2a';rr(ctx,-90,0,180,800,14);ctx.fill();ctx.fillStyle='#4f3d35';rr(ctx,-75,20,150,150,75);ctx.fill();
  ctx.fillStyle='#e9e4d6';ctx.beginPath();ctx.arc(0,95,62,0,7);ctx.fill();ctx.strokeStyle='#2a201c';ctx.lineWidth=4;for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.sin(a)*50,95-Math.cos(a)*50);ctx.lineTo(Math.sin(a)*58,95-Math.cos(a)*58);ctx.stroke();}
  const ha=(11+12/60)/12*Math.PI*2,ma=12/60*Math.PI*2;ctx.lineCap='round';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(Math.sin(ha)*32,95-Math.cos(ha)*32);ctx.stroke();ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,95);ctx.lineTo(Math.sin(ma)*50,95-Math.cos(ma)*50);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20,60);ctx.lineTo(10,100);ctx.lineTo(-5,140);ctx.moveTo(10,100);ctx.lineTo(45,90);ctx.moveTo(10,100);ctx.lineTo(30,135);ctx.moveTo(-20,60);ctx.lineTo(-45,70);ctx.stroke();
  ctx.fillStyle='#241b18';rr(ctx,-50,230,100,420,10);ctx.fill();ctx.fillStyle='#c9a24a';ctx.fillRect(-3,240,6,260);ctx.beginPath();ctx.arc(0,520,34,0,7);ctx.fill();
  ctx.fillStyle='rgba(220,230,255,.8)';for(const[a,b]of[[-60,780],[-20,792],[30,786],[70,795],[5,775]]){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(a+10,b-8);ctx.lineTo(a+16,b+3);ctx.closePath();ctx.fill();}ctx.restore();}
function phoneOnDesk(x,y,t,glow){ctx.save();ctx.translate(x,y);ctx.rotate(-.18);ctx.fillStyle='#10131f';rr(ctx,-34,-14,68,26,6);ctx.fill();ctx.fillStyle=glow?'#7b8cff':'#202744';rr(ctx,-29,-11,58,20,4);ctx.fill();ctx.restore();
  if(glow){const g=ctx.createRadialGradient(x,y,4,x,y,110);g.addColorStop(0,'rgba(120,140,255,.35)');g.addColorStop(1,'rgba(120,140,255,0)');ctx.fillStyle=g;ctx.fillRect(x-110,y-110,220,220);}}
// Verdächtige: Zusatzdetails
function hair(h,s,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(h[0],h[1]-4*s,36*s,Math.PI*1.05,Math.PI*1.95);ctx.fill();ctx.fillRect(h[0]-36*s,h[1]-6*s,14*s,70*s);ctx.fillRect(h[0]+22*s,h[1]-6*s,14*s,70*s);ctx.restore();}
function capHat(h,s,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(h[0],h[1]-6*s,33*s,Math.PI,0);ctx.fill();rr(ctx,h[0]-10*s,h[1]-12*s,60*s,10*s,5*s);ctx.fill();ctx.restore();}
function glasses(h,s){ctx.save();ctx.strokeStyle='#141a33';ctx.lineWidth=3*s;for(const dx of[-11,11]){ctx.beginPath();ctx.arc(h[0]+dx*s,h[1]-3*s,9*s,0,7);ctx.stroke();}ctx.beginPath();ctx.moveTo(h[0]-2*s,h[1]-3*s);ctx.lineTo(h[0]+2*s,h[1]-3*s);ctx.stroke();ctx.restore();}
function coat(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-30,-182);ctx.lineTo(30,-182);ctx.lineTo(44,-70);ctx.lineTo(-44,-70);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-178);ctx.lineTo(0,-72);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.3)';for(const b of[-150,-120,-90]){ctx.beginPath();ctx.arc(7,b,3.5,0,7);ctx.fill();}ctx.restore();}
function wet(x,y,s,t){ctx.save();ctx.fillStyle='rgba(90,160,255,.4)';ctx.beginPath();ctx.ellipse(x,y+4,95*s,15*s,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,180,255,.6)';ctx.lineWidth=2*s;const r=((t*.8)%1)*90*s;ctx.globalAlpha=1-r/(90*s);ctx.beginPath();ctx.ellipse(x+20*s,y+4,r,r*.16,0,0,7);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle='#8cc2ff';
  for(let k=0;k<18;k++){const p=(t*1.1+k*.29)%1,h=(240-((k*37)%200))*s,px=x+(-46+((k*29)%92))*s,py=y-h+p*h;ctx.globalAlpha=1-p*.8;ctx.beginPath();ctx.ellipse(px,py,4.5*s,8*s,0,0,7);ctx.fill();}ctx.restore();}
function wetStreaks(x,y,s){ctx.save();ctx.strokeStyle='rgba(70,140,255,.55)';ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();
  for(const[a,b,c]of[[-8,-190,-120],[6,-175,-95],[0,-60,-15],[-14,-50,-8],[12,-55,-5]]){ctx.moveTo(x+a*s,y+b*s);ctx.lineTo(x+a*s,y+c*s);}ctx.stroke();ctx.restore();}
function bag(x,y,s){ctx.save();ctx.fillStyle='#5a3b2a';rr(ctx,x-4*s,y-6*s,62*s,44*s,8*s);ctx.fill();ctx.strokeStyle='#5a3b2a';ctx.lineWidth=5*s;ctx.beginPath();ctx.arc(x+27*s,y-6*s,14*s,Math.PI,0);ctx.stroke();ctx.restore();}

function suspect(i,x,y,s,t,o={}){const d=SUS[i];
  if(i===1)wet(x,y,s,t);
  const m=man({x,y,s,t,color:o.dark?'#05070f':d.col,back:o.dark?'#05070f':d.back,front:1,seed:i*1.3,label:o.label?d.tag:null,scared:o.scared});
  if(o.dark)return m;

const scenes={
  intro:{draw(t){

    phoneOnDesk(680,982,t,true);

  phone:{draw(t){

    const sg=ctx.createLinearGradient(0,-540,0,540);sg.addColorStop(0,'#232a63');sg.addColorStop(1,'#120f2c');ctx.fillStyle=sg;rr(ctx,-250,-540,500,1080,56);ctx.fill();

    ctx.fillStyle='#cfd5f5';ctx.textAlign='center';ctx.font='800 30px Montserrat, sans-serif';ctx.fillText('VICTOR · NACHRICHTEN',0,-420);

// Großer Stempel „TÄTERIN“
scenes.reveal={draw(t){
  ctx.fillStyle='#14040a';ctx.fillRect(0,0,VW,VH);glow(450,900,700,'255,59,74',.25);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=3;for(let i=0;i<=8;i++){const y=1250-i*70;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VW,y);ctx.stroke();}
  ctx.fillStyle='#0a0206';ctx.fillRect(0,1250,VW,350);
  suspect(0,450,1250,2,t,{label:true,scared:1});
  darkness(.55,[{x:450,y:900,r:520,a:.9}]);
}};
