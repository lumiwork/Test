<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spionage per Werbung für Dummies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@600;800;900&family=JetBrains+Mono:wght@700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/engine.css">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"><div class="night"><i></i></div><div id="clock"></div><div id="loc"></div></div>
  <div id="fx"></div>
  <div id="cap"></div>
  <button id="start">▶ START</button>
  <div id="hint">SPIONAGE PER WERBUNG · FÜR DUMMIES</div>
  <button id="again">↺ NOCHMAL</button>
</div>
<script src="../engine/engine.js"></script>
<script src="../engine/papier.js"></script>
<script>
// Stand: 20.10.2026. Quelle: Citizen Lab „AdFection“ (15.10.2026) mit Confiant; Berichte von SecurityWeek, The Register, Al Jazeera, Dark Reading.
// Welche Lücken genau ausgenutzt wurden, ist nicht veröffentlicht – deshalb Zero-Days nur allgemein erklärt.
// ---------- Bausteine ----------
const ORANGE='#ff8a3d',PURPLE='#8f6bff';
function stamp(txt,col=RED,size=70){ctx.rotate(-.16);ctx.font=`900 ${size}px Montserrat, sans-serif`;const w=ctx.measureText(txt).width+50;stroke(10,col);rr(ctx,-w/2,-size*.75,w,size*1.5,14);ctx.stroke();bold(txt,0,4,size,col);}
function adBanner(w=240,h=110,txt='SALE -70%'){ctx.fillStyle=YEL;rr(ctx,-w/2,-h/2,w,h,10);ctx.fill();stroke(6);rr(ctx,-w/2,-h/2,w,h,10);ctx.stroke();bold(txt,0,4,Math.min(46,w/6),INK);ctx.fillStyle='#fff';rr(ctx,w/2-34,-h/2+6,28,22,4);ctx.fill();bold('AD',w/2-20,-h/2+18,14,INK);}
function bug(t){ctx.save();ctx.rotate(Math.sin(t*6)*.15);ctx.fillStyle=RED;ctx.beginPath();ctx.ellipse(0,0,34,46,0,0,7);ctx.fill();stroke(5);ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,-46,20,0,7);ctx.fill();
  stroke(5);for(const s of[-1,1])for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(s*30,-18+i*18);ctx.lineTo(s*(56+Math.sin(t*12+i)*6),-26+i*22);ctx.stroke();}ctx.beginPath();ctx.moveTo(0,-46);ctx.lineTo(0,46);ctx.stroke();ctx.restore();}
function report(){ctx.fillStyle='#fffdf5';rr(ctx,-170,-220,340,440,10);ctx.fill();stroke(7);rr(ctx,-170,-220,340,440,10);ctx.stroke();bold('BERICHT',0,-170,40);hand('Citizen Lab',0,-118,44,RED);
  stroke(4);for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(-130,-60+i*40);ctx.lineTo(i%3?130:60,-60+i*40);ctx.stroke();}}
function company(){ctx.fillStyle='#e9e2cf';rr(ctx,-140,-160,280,320,10);ctx.fill();stroke(8);rr(ctx,-140,-160,280,320,10);ctx.stroke();ctx.fillStyle='#fffdf5';rr(ctx,-120,-140,240,64,8);ctx.fill();stroke(5);rr(ctx,-120,-140,240,64,8);ctx.stroke();hand('Discover-Tech',0,-106,42);
  for(let r=0;r<2;r++)for(let c=0;c<3;c++){ctx.fillStyle='#bfe3ff';rr(ctx,-110+c*80,-40+r*80,60,60,6);ctx.fill();stroke(4);rr(ctx,-110+c*80,-40+r*80,60,60,6);ctx.stroke();}}
function trojan(t){ctx.save();ctx.scale(1.3,1.3);adBanner(300,140,'GRATIS!');ctx.restore();const o=Math.max(0,Math.sin(t*2))*60;ctx.fillStyle='#2b2926';rr(ctx,40,-60-o*.2,110,70,10);ctx.fill();ctx.save();ctx.translate(95,-25-o*.2);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,0,30,18,0,0,7);ctx.fill();ctx.fillStyle=RED;ctx.beginPath();ctx.arc(Math.sin(t*1.7)*12,0,10,0,7);ctx.fill();ctx.restore();}
function loadBar(p){ctx.fillStyle='#fff';rr(ctx,-220,-26,440,52,26);ctx.fill();ctx.fillStyle=GREEN;rr(ctx,-220,-26,Math.max(52,440*p),52,26);ctx.fill();stroke(6);rr(ctx,-220,-26,440,52,26);ctx.stroke();bold('Werbung lädt…',0,2,26);}
function calendar(){ctx.fillStyle='#fffdf5';rr(ctx,-150,-150,300,300,16);ctx.fill();stroke(8);rr(ctx,-150,-150,300,300,16);ctx.stroke();ctx.fillStyle=RED;rr(ctx,-150,-150,300,80,16);ctx.fill();ctx.fillRect(-150,-100,300,30);bold('TAG',0,-110,44,'#fff');bold('0',0,50,170,INK);}
function counter(n,label,col){ctx.fillStyle=col;rr(ctx,-200,-90,400,180,24);ctx.fill();stroke(8);rr(ctx,-200,-90,400,180,24);ctx.stroke();bold(n,0,-12,84,INK);hand(label,0,56,48);}
function label2(txt,col){ctx.font='900 46px Montserrat, sans-serif';const w=ctx.measureText(txt).width+60;ctx.fillStyle=col;rr(ctx,-w/2,-44,w,88,16);ctx.fill();stroke(7);rr(ctx,-w/2,-44,w,88,16);ctx.stroke();bold(txt,0,4,46,'#fff');}
function toggle(on){ctx.fillStyle=on?GREEN:'#bcb5a4';rr(ctx,-60,-34,120,68,34);ctx.fill();stroke(6);rr(ctx,-60,-34,120,68,34);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(on?26:-26,0,26,0,7);ctx.fill();stroke(5);ctx.stroke();}
function updateIcon(t){ctx.save();ctx.rotate(t*2);stroke(14,BLUE);ctx.beginPath();ctx.arc(0,0,80,.3,Math.PI*1.7);ctx.stroke();ctx.fillStyle=BLUE;ctx.beginPath();ctx.moveTo(80,-40);ctx.lineTo(110,10);ctx.lineTo(50,10);ctx.closePath();ctx.fill();ctx.restore();}

const scenes={
  hook:{draw(t){paper(t);
    at(450,560,popAt(t,0,.25),1,()=>{ctx.scale(1.15,1.15);phone(()=>{ctx.fillStyle='#e8f0ff';ctx.fillRect(-138,-252,276,522);stroke(4,'#bcb5a4');for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-110,-200+i*34);ctx.lineTo(i%2?60:110,-200+i*34);ctx.stroke();}ctx.save();ctx.translate(0,60);adBanner(230,100);ctx.restore();});});
    if(S.hack!=null){const p=ease(Math.min(1,(t-S.hack)/.6));at(450+p*90,630-p*220,1,2,()=>bug(t));ctx.fillStyle=`rgba(230,57,70,${.18*Math.abs(Math.sin(t*8))})`;ctx.fillRect(0,0,VW,1100);at(450,930,popAt(t,S.hack+.2,.3),3,()=>stamp('GEHACKT'));}}},
  research:{draw(t){paper(t);at(450,560,popAt(t,.05,.5),1,()=>report());at(560+Math.sin(t*1.4)*100,520,popAt(t,.3),2,()=>{stroke(16);ctx.beginPath();ctx.moveTo(60,60);ctx.lineTo(150,150);ctx.stroke();ctx.fillStyle='rgba(191,227,255,.5)';ctx.beginPath();ctx.arc(0,0,90,0,7);ctx.fill();stroke(12);ctx.stroke();});
    if(S.name!=null)at(450,230,popAt(t,S.name),3,()=>{ctx.rotate(-.04);marker(-200,-40,400,80);hand('„AdFection“',0,0,66);});}},
  buy:{draw(t){paper(t);at(250,620,popAt(t,.05,.5),1,()=>company());
    if(S.slots!=null)for(let i=0;i<6;i++)at(620+(i%2)*170,360+Math.floor(i/2)*170,popAt(t,S.slots+i*.12),10+i,()=>{ctx.scale(.6,.6);adBanner(240,130,'Platz '+(i+1));});
    if(S.slots!=null)dash([380,520],[480,380],[560,420],GREEN);}},
  spy:{draw(t){paper(t);at(450,560,popAt(t,.05,.5),1,()=>trojan(t));if(S.cand!=null)at(450,820,popAt(t,S.cand),2,()=>{ctx.rotate(-.04);marker(-230,-38,460,76);hand('Spionage-Software',0,0,58);});}},
  noclick:{draw(t){paper(t);
    at(260,420,popAt(t,.05),1,()=>{ctx.fillStyle='#f2d7b0';rr(ctx,-30,-120,60,180,30);ctx.fill();stroke(6);rr(ctx,-30,-120,60,180,30);ctx.stroke();});at(260,420,popAt(t,.3),2,()=>{stroke(16,RED);ctx.beginPath();ctx.moveTo(-120,-140);ctx.lineTo(120,100);ctx.moveTo(120,-140);ctx.lineTo(-120,100);ctx.stroke();});hand('kein Klick nötig',260,640,54);
    if(S.load!=null){at(620,420,popAt(t,S.load),3,()=>{ctx.scale(.7,.7);adBanner(260,120);});at(450,820,popAt(t,S.load),4,()=>loadBar(Math.min(1,(t-S.load)*.8)));if(t-S.load>1.2)at(620,330,1,5,()=>{ctx.scale(.7,.7);bug(t);});}}},
  zeroday:{draw(t){paper(t);at(280,520,popAt(t,.05,.5),1,()=>calendar());
    if(S.zd!=null){at(650,520,popAt(t,S.zd),2,()=>{ctx.scale(2,2);padlock(YEL,.5);});stroke(8,RED);ctx.beginPath();ctx.moveTo(630,470);ctx.lineTo(660,520);ctx.lineTo(640,560);ctx.stroke();
      at(450,850,popAt(t,S.zd+.3),3,()=>{ctx.rotate(-.03);marker(-300,-40,600,80);hand('Lücke, die keiner kennt',0,0,56);});}}},
  scale:{draw(t){paper(t);at(450,330,popAt(t,.05),1,()=>counter('70.000+','Apps',YEL));
    if(S.web!=null)at(450,620,popAt(t,S.web),2,()=>counter('120.000+','Webseiten',GREEN));
    at(450,880,popAt(t,.4),3,()=>{ctx.rotate(-.03);marker(-200,-36,400,72);hand('März – Juni 2026',0,0,56);});}},
  victims:{draw(t){paper(t);at(450,380,popAt(t,.05,.5),1,()=>label2('AL JAZEERA',ORANGE));
    if(S.nato!=null){at(260,680,popAt(t,S.nato),2,()=>label2('NATO',BLUE));at(640,680,popAt(t,S.nato+.25),3,()=>label2('EU-PARLAMENT',PURPLE));hand('Anzeigen erreichten auch:',450,560,52);}}},
  tips:{draw(t){paper(t);at(240,480,popAt(t,.05,.5),1,()=>updateIcon(t));hand('Updates!',240,640,60,BLUE);
    if(S.adid!=null){at(650,420,popAt(t,S.adid),2,()=>{ctx.scale(.55,.55);phone(()=>{ctx.fillStyle='#fbfaf5';ctx.fillRect(-138,-252,276,522);bold('Werbe-ID',-20,-40,30,INK);ctx.save();ctx.translate(70,40);toggle(t-S.adid<.8);ctx.restore();});});
      at(650,760,popAt(t,S.adid+.3),3,()=>{ctx.rotate(-.04);marker(-110,-34,220,68);hand('aus',0,0,58);});}}},
  end:{draw(t){paper(t);at(450,540,popAt(t,.05,.5),1,()=>{ctx.scale(1.4,1.4);adBanner();});at(450,540,popAt(t,.4),2,()=>{stroke(14,RED);ctx.beginPath();ctx.arc(0,0,230,0,7);ctx.moveTo(-162,-162);ctx.lineTo(162,162);ctx.stroke();});}},
};

// ---------- Ablauf ----------
async function story(){
  go('hook');hud(false);sfx('pop',.6);
  const tag0=card(`<span class="ln pill">NEWS · FÜR DUMMIES</span>`,{top:'4%'});
  await capAt('Du siehst eine #Werbung. Und dein Handy ist *gehackt.*',4,()=>{S.hack=now();sfx('hit',.8);sfx('static',.3);});
  out(tag0);go('research');sfx('pop',.6);
  await capAt('Genau das haben Forscher vom Citizen Lab gerade *aufgedeckt.*',4,()=>{S.name=now();sfx('scribble',.4);});
  go('buy');sfx('pop',.6);
  await capAt('Eine israelische Werbefirma namens Discover-Tech kaufte ganz normale #Werbeplätze.',6,()=>{S.slots=now();sfx('ding',.4);});
  go('spy');sfx('whoosh',.4);
  await capAt('Darüber lieferte sie Spionage-Software der Firma *Candiru* aus.',2,()=>{S.cand=now();sfx('hit',.5);});
  go('noclick');sfx('pop',.6);
  await capAt('Das Gemeine: Du musst nichts #anklicken. Die Werbung muss nur *laden.*',5,()=>{S.load=now();sfx('click',.4);setTimeout(()=>sfx('hit',.6),1300);});
  go('zeroday');sfx('pop',.6);
  await capAt('Solche Angriffe nutzen meist #Zero-Days: Lücken, die der Hersteller noch nicht *kennt.*',3,()=>{S.zd=now();sfx('hit',.5);});
  go('scale');sfx('pop',.6);
  await capAt('Die Werbung lief in über 70.000 Apps und 120.000 #Webseiten.',5,()=>{S.web=now();sfx('pop',.6);});
  go('victims');sfx('pop',.6);
  await cap('Betroffen war zum Beispiel der Sender *Al Jazeera.*');
  await capAt('Die Anzeigen erreichten sogar Netzwerke von #Nato und *EU-Parlament.*',3,()=>{S.nato=now();sfx('ding',.5);});
  go('tips');sfx('pop',.6);
  await cap('Was du tun kannst: Handy und Browser immer *updaten.*');
  await capAt('Und in den Einstellungen die #Werbe-ID ausschalten.',2,()=>{S.adid=now();sfx('click',.6);});
  go('end');sfx('pop',.6);
  dimT=.2;await cap('Blockierst du Werbung auf deinem Handy? Ja oder *nein?*',{big:1});
  dimT=.35;outro('NEWS FÜR DUMMIES','MEHR <span class="hl">NEWS</span>','JA ODER NEIN? 👇');
  await sleep(3800);finish();
}
boot('hook');
</script>
</body>
</html>
